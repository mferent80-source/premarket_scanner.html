<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f6ff">
<title>404 — Pagina nu a fost găsită</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6ff; --bg2:#ffffff; --b1:#dde2f5;
  --t1:#0f172a; --t2:#475569; --t3:#94a3b8;
  --indigo:#4f46e5; --teal:#0d9488;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sora',sans-serif;color:var(--t1);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1000px 600px at 10% -10%, rgba(79,70,229,.10), transparent 60%),
    radial-gradient(900px 600px at 110% 10%, rgba(13,148,136,.08), transparent 60%),
    var(--bg);
}
.box{
  text-align:center;max-width:480px;
  background:var(--bg2);border:1px solid var(--b1);border-radius:16px;
  padding:48px 32px;box-shadow:0 8px 24px rgba(0,0,0,.06);
}
.code{
  font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.18em;
  color:var(--t3);text-transform:uppercase;margin-bottom:16px;
}
h1{
  font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:16px;
  background:linear-gradient(135deg,var(--indigo),var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
p{color:var(--t2);font-size:15px;margin-bottom:28px;line-height:1.55}
a{
  display:inline-block;padding:12px 28px;border-radius:10px;
  background:linear-gradient(135deg,var(--indigo),var(--teal));color:#fff;
  text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.02em;
  transition:transform .15s ease, box-shadow .15s ease;
}
a:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.3)}
</style>
</head>
<body>
<div class="box">
  <div class="code">Error 404</div>
  <h1>404</h1>
  <p>Pagina căutată nu există sau a fost mutată.<br>Întoarce-te la pagina principală.</p>
  <a href="../">← Înapoi acasă</a>
</div>
</body>
</html>
