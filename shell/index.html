<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../lib/theme-light.css?v=791">
<script src="../lib/theme.js?v=736"></script>
<script src="../lib/suite-version.js?v=791"></script>
<script src="../lib/macro-context.js?v=619"></script>
<script src="../lib/hub-state.js?v=626"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Tools — App</title>
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* ── tokeni de bază: nume identice cu cele mapate în lib/theme-light.css
        (--bg/--panel/--panel2/--b1/--t1/--t3…), ca :root[data-theme="light"]
        să le suprascrie automat — shell-ul nu are alt :root propriu. ── */
  :root{
    --bg:#0b0f17; --panel:#0d1320; --panel2:#141d30; --panel3:#1b2740;
    --b1:#1e2942; --b2:#1e2942;
    --t1:#e6edf3; --t3:#9aa4b2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--t1);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100dvh;height:100vh}
  /* ── bara de taburi (sus) ── */
  #tabbar{flex:0 0 auto;display:flex;gap:3px;overflow-x:auto;padding:calc(6px + env(safe-area-inset-top,0px)) 6px 0;
    background:var(--panel);border-bottom:1px solid var(--b1);scrollbar-width:none}
  #tabbar::-webkit-scrollbar{display:none}
  #suiteVerShell{flex:0 0 auto;align-self:center;margin:0 8px 4px 4px;padding:3px 8px;border-radius:6px;
    font-size:10px;font-weight:700;font-family:ui-monospace,monospace;color:#f7931a;
    border:1px solid rgba(247,147,26,.4);background:rgba(247,147,26,.12);white-space:nowrap}
  #shellStaleNav{flex:0 0 auto;align-self:center;margin:0 4px 4px 0;padding:3px 8px;border-radius:6px;
    font-size:10px;font-weight:700;font-family:ui-monospace,monospace;text-decoration:none;
    border:1px solid rgba(212,137,44,.45);background:rgba(212,137,44,.14);color:#d4892c;white-space:nowrap}
  #shellStaleNav.err{border-color:rgba(255,77,77,.5);background:rgba(255,77,77,.14);color:#ff6b6b}
  #shellStaleNav[hidden]{display:none}
  .tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;max-width:170px;padding:8px 9px;border-radius:9px 9px 0 0;
    background:var(--panel2);border:1px solid var(--b1);border-bottom:none;color:var(--t3);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--panel3);color:var(--t1)}
  .tab .i{font-size:14px;line-height:1}
  .tab .tx{overflow:hidden;text-overflow:ellipsis;max-width:96px}
  .tab .cl{opacity:.55;font-size:12px;line-height:1;padding:2px 4px;border-radius:5px;margin-left:1px}
  .tab .cl:hover{opacity:1;background:rgba(255,255,255,.12);color:#ff6b6b}
  /* ── zona cu pagini (iframe-uri) ── */
  #frames{flex:1 1 auto;position:relative;background:var(--bg);min-height:0}
  #frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  #frames iframe.active{display:block}
  /* ── dock lansator (jos) ── */
  #dock{flex:0 0 auto;display:flex;gap:2px;overflow-x:auto;justify-content:safe center;
    padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));background:var(--panel);
    border-top:1px solid var(--b1);scrollbar-width:none;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
  #dock::-webkit-scrollbar{display:none}
  #dock a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px;padding:5px 7px;
    border-radius:10px;color:var(--t3);text-decoration:none;font-size:9.5px;font-weight:600;cursor:pointer}
  #dock a:hover{color:var(--t1);background:rgba(255,255,255,.06)}
  #dock a.cur{color:#0b0f17;background:linear-gradient(135deg,#f7931a,#ffd86b)}
  #dock a .i{font-size:17px;line-height:1}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:stretch;min-width:0">
    <div id="tabbar" aria-label="Taburi deschise" style="flex:1;min-width:0"></div>
    <a href="../health/" id="shellStaleNav" hidden aria-hidden="true" title="Date învechite">📦</a>
    <span id="suiteVerShell" title="Versiune cache suită">…</span>
  </div>
  <div id="frames"></div>
  <nav id="dock" aria-label="Deschide pagină"></nav>
</div>
<script>
(function(){
  var PAGES = [
    { u:'',                   n:'Hub',      e:'🏠' },
    { u:'macro-dashboard/',   n:'Macro',    e:'🌍' },
    { u:'sector-rotation/',   n:'Sector',   e:'🔄' },
    { u:'nasdaq-scanner/',    n:'Nasdaq',   e:'📈' },
    { u:'earnings-hub/',      n:'Earnings', e:'📅' },
    { u:'smart-trade-long/',  n:'Smart',    e:'🚀' },
    { u:'watchlist-monitor/', n:'Watch',    e:'👁️' },
    { u:'alerts/',            n:'Alerts',   e:'🔔' },
    { u:'market-events/',     n:'Events',   e:'📊' },
    { u:'pump-radar/',        n:'Pump',     e:'🔥' },
    { u:'markov-lab/',        n:'Markov',   e:'🔗' },
    { u:'guide/',             n:'Ghid',     e:'📖' },
    { u:'journal/',           n:'Journal',  e:'📓' },
    { u:'journal/#portfolio', n:'Portof.',  e:'🛡️' },
    { u:'router/',            n:'Router',   e:'🧭' },
    { u:'shadow-book/',       n:'Shadow',   e:'👻' },
    { u:'postmortem/',        n:'PM',       e:'🔬' },
    { u:'weekly/',            n:'Weekly',   e:'📅' },
    { u:'health/',            n:'Health',   e:'🩺' }
  ];
  var byU = {}; PAGES.forEach(function(p){ byU[p.u] = p; });
  var ROOT = '../'; // shell e la /shell/, paginile la /<page>/

  var open = [];
  try { open = JSON.parse(localStorage.getItem('tt_open_tabs') || '[]'); } catch(e){ open = []; }
  open = open.filter(function(u){ return byU[u] !== undefined; });
  if (!open.length) open = ['']; // implicit: Hub
  var active = localStorage.getItem('tt_active_tab');
  if (active === null || byU[active] === undefined || open.indexOf(active) < 0) active = open[0];

  var frames = {}; // u -> iframe
  var framesEl = document.getElementById('frames');
  var tabbarEl = document.getElementById('tabbar');
  var dockEl   = document.getElementById('dock');

  function persist(){ try { localStorage.setItem('tt_open_tabs', JSON.stringify(open)); localStorage.setItem('tt_active_tab', active); } catch(e){} }

  function ensureFrame(u){
    if (frames[u]) return frames[u];
    var f = document.createElement('iframe');
    f.src = ROOT + u; f.dataset.u = u;
    f.setAttribute('title', (byU[u] || {}).n || u);
    // La încărcare, spune iframe-ului dacă e activ — paginile își pot pauza polling-ul în fundal
    // (un iframe display:none NU primește visibilitychange, deci ar scana inutil în paralel).
    f.addEventListener('load', function(){ try { f.contentWindow.postMessage({ ttShellVisible: f.dataset.u === active }, location.origin); } catch(_){} });
    framesEl.appendChild(f); frames[u] = f; return f;
  }
  function notifyVisible(){
    // Notifică fiecare iframe dacă e vizibil (activ) — paginile pot pauza polling-ul în fundal.
    for (var k in frames){ try { frames[k].contentWindow.postMessage({ ttShellVisible: k === active }, location.origin); } catch(_){} }
  }
  function setActive(u){
    if (byU[u] === undefined) return;
    if (open.indexOf(u) < 0) open.push(u);
    active = u; ensureFrame(u);
    for (var k in frames) frames[k].classList.toggle('active', k === u);
    notifyVisible();
    renderTabs(); renderDock(); persist();
  }
  function closeTab(u){
    var i = open.indexOf(u); if (i < 0) return;
    open.splice(i, 1);
    if (frames[u]){ frames[u].remove(); delete frames[u]; }
    if (!open.length){ open = ['']; ensureFrame(''); }
    if (active === u) active = open[Math.min(i, open.length - 1)] || open[0];
    setActive(active);
  }
  function renderTabs(){
    tabbarEl.innerHTML = '';
    open.forEach(function(u){
      var p = byU[u];
      var t = document.createElement('div');
      t.className = 'tab' + (u === active ? ' active' : '');
      t.innerHTML = '<span class="i">' + p.e + '</span><span class="tx">' + p.n + '</span>' +
                    (open.length > 1 ? '<span class="cl" data-cl="1" title="Închide tab">✕</span>' : '');
      t.onclick = function(ev){ if (ev.target && ev.target.getAttribute('data-cl')) closeTab(u); else setActive(u); };
      tabbarEl.appendChild(t);
      if (u === active && t.scrollIntoView){ try { t.scrollIntoView({ inline:'nearest', block:'nearest' }); } catch(_){} }
    });
  }
  function renderDock(){
    dockEl.innerHTML = '';
    PAGES.forEach(function(p){
      var a = document.createElement('a');
      a.className = (p.u === active ? 'cur' : '');
      a.title = (open.indexOf(p.u) >= 0 ? 'Comută la ' : 'Deschide ') + p.n;
      a.innerHTML = '<span class="i">' + p.e + '</span><span>' + p.n + '</span>';
      a.onclick = function(){ setActive(p.u); };
      dockEl.appendChild(a);
    });
  }

  var EXTRA_PAGES = {
    'router/':       { n:'Router', e:'🧭' },
    'shadow-book/':  { n:'Shadow', e:'👻' },
    'postmortem/':   { n:'PM',     e:'🔬' },
    'governor/':     { n:'Gov',    e:'🛑' }
  };
  function ensurePage(u){
    if (byU[u] !== undefined) return;
    var m = EXTRA_PAGES[u] || { n: (u.replace(/\/$/, '') || 'page'), e: '📄' };
    var p = { u: u, n: m.n, e: m.e };
    PAGES.push(p);
    byU[u] = p;
  }
  function applyFrameHash(u, hash){
    if (!hash || !frames[u]) return;
    var f = frames[u];
    var go = function(){ try { f.contentWindow.location.hash = hash; } catch(_){} };
    try {
      if (f.contentDocument && f.contentDocument.readyState === 'complete') go();
      else f.addEventListener('load', go, { once: true });
    } catch(_){ f.addEventListener('load', go, { once: true }); }
  }

  // paginile (din iframe) cer deschiderea unui tab prin postMessage (vezi nav.js + hub head)
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin) return;
    var d = e.data;
    if (!d || d.ttOpen === undefined) return;
    ensurePage(d.ttOpen);
    setActive(d.ttOpen);
    if (d.ttHash) applyFrameHash(d.ttOpen, d.ttHash);
  });

  // init: creează iframe-urile pentru taburile salvate, activează ultimul activ
  open.forEach(ensureFrame);
  setActive(active);

  // service worker — înregistrare simplă, fără auto-reload (evită loop în PWA)
  if ('serviceWorker' in navigator) {
    var swVer = 'tt-v791';
    navigator.serviceWorker.register('../sw-app.js?v=' + swVer, { updateViaCache: 'none' }).catch(function(){});
  }
  if (window.SUITE_VERSION_SHORT) {
    var vb = document.getElementById('suiteVerShell');
    if (vb) vb.textContent = window.SUITE_VERSION_SHORT;
  }
  function shellStaleTick(){
    if (window.HS && HS.renderStaleNav) HS.renderStaleNav('shellStaleNav');
  }
  shellStaleTick();
  setInterval(shellStaleTick, 60000);
  window.addEventListener('storage', shellStaleTick);

  // manifest inline — aplicația pornește în shell, scope = rădăcina suite-ului
  var icon192 = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='38' fill='%23f7931a'/%3E%3Ctext y='128' x='96' text-anchor='middle' font-size='96'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E";
  var icon512 = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='102' fill='%23f7931a'/%3E%3Ctext y='340' x='256' text-anchor='middle' font-size='256'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E";
  var mf = { name:'Trading Tools', short_name:'Tools', start_url: location.href.split('?')[0], scope:'../',
    display:'standalone', background_color:'#0b0f17', theme_color:'#f7931a',
    icons:[ {src:icon192,sizes:'192x192',type:'image/svg+xml',purpose:'any maskable'},
            {src:icon512,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'} ] };
  var ml = document.createElement('link'); ml.rel = 'manifest';
  ml.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type:'application/json' }));
  document.head.appendChild(ml);
})();
</script>
<!-- tt:sw-guard:start -->
<script>
/* GENERAT de tools/sync-suite-version.mjs — nu edita manual. */
(function () {
  var PAGE_VER = 'tt-v791';
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('../sw-app.js?v=' + PAGE_VER, { scope: '../', updateViaCache: 'none' })
    .then(function (reg) {
      try { reg.update(); } catch (e) {}
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }).catch(function () {});
  var sw = navigator.serviceWorker.controller;
  if (!sw) return;                       // prima vizită: nu există SW vechi de corectat
  var ch = new MessageChannel();
  ch.port1.onmessage = function (e) {
    var v = (e.data && e.data.version) || '';
    if (v.indexOf(PAGE_VER + '-') === 0 || v === PAGE_VER) return;   // la zi
    var K = 'tt_swfix_' + PAGE_VER;      // o singură reîncărcare per versiune
    if (sessionStorage.getItem(K)) { console.warn('[sw-guard] SW vechi persistent:', v, '!=', PAGE_VER); return; }
    sessionStorage.setItem(K, '1');
    console.warn('[sw-guard] SW ' + v + ' != pagina ' + PAGE_VER + ' - fortez actualizarea');
    navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return;
      try { reg.update(); } catch (e2) {}
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }).catch(function () {});
  };
  try { sw.postMessage({ type: 'GET_VERSION' }, [ch.port2]); } catch (e) {}
})();
</script>
<!-- tt:sw-guard:end -->
</body>
</html>
