<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070b11;--bg-grad:radial-gradient(1200px 600px at 50% -200px,#142533 0%,#0b0f17 55%);
  --panel:#171f30;--panel2:#222c44;--panel3:#222b40;
  --b1:#4a5874;--b2:#3a4258;
  --t1:#fafbfc;--t2:#eef2f8;--t3:#d0d8e6;
  --acc-1:#3b82f6;--acc-2:#10b981;--accent:#8ac8ff;
  --bull-s:#3aeb88;--bear-s:#ff6b6b;--warn:#d4892c;--gold:#ffd86b;--purple:#a78bfa;
  --r:12px;--rs:8px;
  --mono:'DM Mono',monospace;--head:'Sora',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:dark;
}
html,body{min-height:100vh}
body{
  font-family:var(--head);background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  color:var(--t1);padding:12px;font-size:14px;
  -webkit-font-smoothing:auto;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums;
}
header{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:var(--topbar-bg);
  padding:10px 14px;border-radius:var(--r);
  border:1px solid var(--b1);margin:0 0 12px;
  box-shadow:var(--topbar-shadow);
  position:sticky;top:0;z-index:60;
}
header h1{
  font-size:18px;font-weight:800;
  background:linear-gradient(90deg,#a78bfa,#5bb0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-right:auto;font-family:var(--head);
}
.ver-badge{
  display:inline-block;padding:3px 8px;margin-left:8px;border-radius:4px;
  background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.4);
  font-size:11px;font-weight:700;-webkit-text-fill-color:#a78bfa;font-family:var(--mono);
}
.nav-link{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--panel2);border:1px solid var(--b1);
  padding:7px 12px;border-radius:var(--rs);
  color:var(--t1);text-decoration:none;font-size:12.5px;font-weight:700;
}
.nav-link:hover{background:var(--accent);border-color:var(--accent);color:#000;transform:translateY(-1px)}

/* Toolbar */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--panel);border:1px solid var(--b1);border-top:3px solid var(--purple);border-radius:var(--r);
  padding:12px 16px;margin-bottom:12px;
}
.view-tabs{display:flex;gap:4px;background:var(--bg);border-radius:var(--rs);padding:3px;border:1px solid var(--b1)}
.view-tab{
  background:transparent;border:none;color:var(--t2);
  padding:6px 14px;border-radius:5px;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s ease;
}
.view-tab.active{background:linear-gradient(135deg,var(--acc-1),var(--acc-2));color:#fff;box-shadow:0 2px 6px rgba(59,130,246,.3)}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.legend-row{display:flex;align-items:center;gap:11px;padding:9px 12px;background:var(--panel2);border:1px solid var(--b1);border-radius:var(--rs)}
.legend-emoji{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.legend-desc{font-size:12.5px;color:var(--t1);line-height:1.4}
.view-tab:hover:not(.active){color:var(--t1);background:var(--panel2)}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap input{
  width:100%;background:var(--panel2);color:var(--t1);
  border:1px solid var(--b1);padding:9px 36px 9px 14px;border-radius:var(--rs);
  font-size:13px;font-family:inherit;
}
.search-wrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,176,255,.2)}
.search-wrap::before{content:"🔍";position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5}
.counter{font-family:var(--mono);font-size:11.5px;color:var(--t2);background:var(--panel3);padding:5px 10px;border-radius:999px;border:1px solid var(--b1)}

/* Page sections */
.page-section{
  background:var(--panel);border:1px solid var(--b1);border-top:3px solid var(--acc-1);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden;
}
.page-section-head{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-bottom:1px solid var(--b1);cursor:pointer;
  transition:background .15s ease;
}
.page-section-head:hover{background:linear-gradient(180deg,var(--panel3),var(--panel2))}
.page-section-head h2{font-family:var(--head);font-size:15px;font-weight:800;color:var(--t1);flex:1}
.page-section-head .feat-count{
  background:var(--panel3);color:var(--t1);padding:2px 10px;
  border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:700;
  border:1px solid var(--b1);
}
.page-section-head .page-link{
  background:transparent;border:1px solid var(--b1);color:var(--t2);
  padding:4px 12px;border-radius:4px;font-family:var(--head);font-size:11.5px;
  font-weight:700;text-decoration:none;
}
.page-section-head .page-link:hover{color:var(--accent);border-color:var(--accent)}
.page-section-head .chevron{transition:transform .2s ease;color:var(--t2);font-size:14px}
.page-section.collapsed .chevron{transform:rotate(-90deg)}
.page-section.collapsed .features-grid{display:none}

.features-grid{
  padding:12px 16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;
}
.feat-card{
  background:var(--panel2);border:1px solid var(--b1);border-radius:var(--rs);
  padding:10px 12px;display:flex;flex-direction:column;gap:5px;
  position:relative;transition:all .15s ease;
}
.feat-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.feat-card.new::before{
  content:"NOU";position:absolute;top:-6px;right:-6px;
  background:linear-gradient(135deg,var(--bull-s),var(--gold));
  color:#0a0a0a;font-family:var(--mono);font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:4px;letter-spacing:.5px;
  box-shadow:0 2px 6px rgba(34,214,107,.4);
}
.feat-head{display:flex;align-items:center;gap:8px}
.feat-icon{font-size:18px;flex-shrink:0}
.feat-name{font-weight:700;font-size:13px;color:var(--t1);flex:1}
.feat-desc{font-size:12px;color:var(--t2);line-height:1.45}
.feat-meta{display:flex;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-top:3px;flex-wrap:wrap}
.feat-meta .cat-chip{padding:1px 6px;border-radius:3px;font-weight:700}
.feat-meta .cat-data{background:rgba(91,176,255,.12);color:var(--accent);border:1px solid rgba(91,176,255,.3)}
.feat-meta .cat-ai{background:rgba(167,139,250,.12);color:var(--purple);border:1px solid rgba(167,139,250,.3)}
.feat-meta .cat-alerts{background:rgba(212,137,44,.12);color:var(--warn);border:1px solid rgba(212,137,44,.3)}
.feat-meta .cat-charts{background:rgba(34,214,107,.12);color:var(--bull-s);border:1px solid rgba(34,214,107,.3)}
.feat-meta .cat-risk{background:rgba(255,77,77,.12);color:var(--bear-s);border:1px solid rgba(255,77,77,.3)}
.feat-meta .cat-ux{background:rgba(255,216,107,.12);color:var(--gold);border:1px solid rgba(255,216,107,.3)}
.feat-meta .cat-integration{background:rgba(100,116,139,.18);color:#94a3b8;border:1px solid rgba(100,116,139,.4)}
.feat-meta .date{opacity:.7}

/* Changelog */
.changelog-entry{
  display:grid;grid-template-columns:130px 1fr;gap:14px;
  padding:12px 0;border-bottom:1px solid rgba(42,50,71,.4);
}
.changelog-entry:last-child{border-bottom:none}
.changelog-date{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700}
.changelog-date small{display:block;font-size:11px;color:var(--t3);margin-top:2px;font-weight:400}
.changelog-features{display:flex;flex-direction:column;gap:6px}
.changelog-item{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.45}
.changelog-item .page-tag{
  background:var(--panel3);color:var(--t2);padding:1px 7px;border-radius:3px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;border:1px solid var(--b1);
}
.changelog-item .feat-name-cl{color:var(--t1);font-weight:700}
.changelog-item .feat-desc-cl{color:var(--t2)}

/* By category */
.category-section{
  background:var(--panel);border:1px solid var(--b1);border-top:3px solid var(--acc-2);border-radius:var(--r);
  margin-bottom:12px;padding:14px 18px;
}
.category-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b1)}
.category-head h2{font-size:15px;font-weight:800;color:var(--t1);flex:1}
.cat-features{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

.empty-state{padding:60px 20px;text-align:center;color:var(--t2);font-style:italic}
.empty-state .ic{font-size:48px;display:block;margin-bottom:10px;opacity:.4}

@media(max-width:640px){
  .features-grid,.cat-features{grid-template-columns:1fr}
  .changelog-entry{grid-template-columns:1fr}
  .changelog-date{font-size:12px}
}
</style>
</head>

// ═══════════════════════════════════════════════════════════════
//  STATE + RENDER
// ═══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const NEW_THRESHOLD_DAYS = 7;
function isNew(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  return (Date.now() - d.getTime()) < NEW_THRESHOLD_DAYS * 86400000;
}

let currentView = 'page';
let searchQuery = '';

// Suport ?page=<slug> — auto-expand acea pagină în view "page" + scroll
const urlParams = new URLSearchParams(window.location.search);
const focusPage = urlParams.get('page');

function flattenFeatures() {
  return FEATURES_DB.flatMap(p => p.features.map(f => ({ ...f, page: p.page, pageLabel: p.pageLabel, pageUrl: p.pageUrl })));
}

function filterFeatures(features) {
  if (!searchQuery) return features;
  const q = searchQuery.toLowerCase();
  return features.filter(f =>
    (f.name || '').toLowerCase().includes(q) ||
    (f.desc || '').toLowerCase().includes(q) ||
    (f.cat || '').toLowerCase().includes(q) ||
    (f.pageLabel || '').toLowerCase().includes(q)
  );
}

function renderFeatureCard(f) {
  const newBadge = isNew(f.added) ? ' new' : '';
  const catLabel = { data:'DATA', ai:'AI', alerts:'ALERTS', charts:'CHARTS', risk:'RISK', ux:'UX', integration:'INTEGR' }[f.cat] || (f.cat || '').toUpperCase();
  return `<div class="feat-card${newBadge}">
    <div class="feat-head">
      <span class="feat-icon">${f.icon || '•'}</span>
      <span class="feat-name">${escHtml(f.name)}</span>
    </div>
    <div class="feat-desc">${escHtml(f.desc)}</div>
    <div class="feat-meta">
      <span class="cat-chip cat-${f.cat}">${catLabel}</span>
      ${f.version ? `<span>${escHtml(f.version)}</span>` : ''}
      <span class="date">${escHtml(f.added || '')}</span>
    </div>
  </div>`;
}

function renderByPage() {
  const content = $('content');
  let totalCount = 0;
  let filteredCount = 0;
  const html = FEATURES_DB.map(p => {
    totalCount += p.features.length;
    const filtered = filterFeatures(p.features.map(f => ({ ...f, pageLabel: p.pageLabel })));
    filteredCount += filtered.length;
    if (!filtered.length && searchQuery) return '';
    return `<div class="page-section">
      <div class="page-section-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <h2>${escHtml(p.pageLabel)}</h2>
        <span class="feat-count">${filtered.length}/${p.features.length}</span>
        <a class="page-link" href="${escHtml(p.pageUrl)}" target="_blank" onclick="event.stopPropagation()">Open →</a>
        <span class="chevron">▼</span>
      </div>
      <div class="features-grid">${filtered.map(renderFeatureCard).join('')}</div>
    </div>`;
  }).join('');
  $('counter').textContent = `${filteredCount} / ${totalCount} features`;
  content.innerHTML = html || '<div class="empty-state"><span class="ic">🔍</span>Niciun feature găsit pentru "' + escHtml(searchQuery) + '"</div>';
}

function renderByCategory() {
  const all = flattenFeatures();
  const filtered = filterFeatures(all);
  $('counter').textContent = `${filtered.length} / ${all.length} features`;
  if (!filtered.length) {
    $('content').innerHTML = '<div class="empty-state"><span class="ic">🔍</span>Niciun feature găsit pentru "' + escHtml(searchQuery) + '"</div>';
    return;
  }
  const cats = ['data', 'ai', 'alerts', 'charts', 'risk', 'ux', 'integration'];
  const catLabels = {
    data: '📊 Data Sources & Scanners',
    ai: '🤖 AI Features (Claude)',
    alerts: '🔔 Alerts & Notifications',
    charts: '📈 Charts & Visualization',
    risk: '🛡 Risk Management',
    ux: '✨ UX & Interface',
    integration: '🔄 Integration & Cross-page'
  };
  const html = cats.map(cat => {
    const list = filtered.filter(f => f.cat === cat);
    if (!list.length) return '';
    return `<div class="category-section">
      <div class="category-head">
        <h2>${catLabels[cat]}</h2>
        <span class="feat-count">${list.length} features</span>
      </div>
      <div class="cat-features">${list.map(f => {
        const pageBadge = `<span class="page-tag" style="margin-bottom:5px;display:inline-block;background:rgba(91,176,255,.12);color:var(--accent);border-color:rgba(91,176,255,.3)">${escHtml(f.pageLabel)}</span>`;
        return renderFeatureCard(f).replace('<div class="feat-meta">', pageBadge + '<div class="feat-meta">');
      }).join('')}</div>
    </div>`;
  }).join('');
  $('content').innerHTML = html;
}

function renderChangelog() {
  const all = flattenFeatures();
  const filtered = filterFeatures(all);
  $('counter').textContent = `${filtered.length} / ${all.length} features`;
  if (!filtered.length) {
    $('content').innerHTML = '<div class="empty-state"><span class="ic">🔍</span>Niciun feature găsit pentru "' + escHtml(searchQuery) + '"</div>';
    return;
  }
  // Group by date desc
  const byDate = {};
  filtered.forEach(f => {
    const d = f.added || 'unknown';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(f);
  });
  const dates = Object.keys(byDate).sort().reverse();
  const today = new Date().toISOString().slice(0,10);
  const html = '<div class="category-section">' + dates.map(d => {
    const ago = d === 'unknown' ? '' : (() => {
      const diff = Math.round((new Date(today) - new Date(d)) / 86400000);
      if (diff === 0) return 'azi';
      if (diff === 1) return 'ieri';
      if (diff < 7) return `acum ${diff}z`;
      if (diff < 30) return `acum ${Math.round(diff/7)}săpt`;
      return `acum ${Math.round(diff/30)}luni`;
    })();
    return `<div class="changelog-entry">
      <div class="changelog-date">${escHtml(d)}<small>${ago}</small></div>
      <div class="changelog-features">${byDate[d].map(f => `<div class="changelog-item">
        <span class="page-tag">${escHtml(f.pageLabel)}</span>
        <span class="feat-icon">${f.icon || '•'}</span>
        <span class="feat-name-cl">${escHtml(f.name)}</span>
        ${f.version ? `<span class="page-tag" style="background:rgba(167,139,250,.12);color:var(--purple);border-color:rgba(167,139,250,.3)">${escHtml(f.version)}</span>` : ''}
        ${isNew(f.added) ? '<span style="background:linear-gradient(135deg,var(--bull-s),var(--gold));color:#0a0a0a;font-family:var(--mono);font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.5px">NOU</span>' : ''}
      </div>`).join('')}</div>
    </div>`;
  }).join('') + '</div>';
  $('content').innerHTML = html;
}

function renderLegend() {
  const q = (searchQuery || '').toLowerCase();
  let total = 0, shown = 0;
  const html = EMOJI_LEGEND.map(g => {
    const items = g.items.filter(([e, d]) => { total++; const m = !q || d.toLowerCase().includes(q) || e.includes(q); if (m) shown++; return m; });
    if (!items.length) return '';
    return `<div class="category-section">
      <div class="category-head"><h2>${g.group}</h2><span class="feat-count">${items.length}</span></div>
      <div class="legend-grid">${items.map(([e, d]) =>
        `<div class="legend-row"><span class="legend-emoji">${e}</span><span class="legend-desc">${escHtml(d)}</span></div>`).join('')}</div>
    </div>`;
  }).join('');
  $('counter').textContent = `${shown} / ${total} simboluri`;
  $('content').innerHTML = html || '<div class="empty-state"><span class="ic">🔍</span>Niciun simbol găsit pentru "' + escHtml(searchQuery) + '"</div>';
}

function render() {
  if (currentView === 'page') renderByPage();
  else if (currentView === 'category') renderByCategory();
  else if (currentView === 'changelog') renderChangelog();
  else if (currentView === 'legend') renderLegend();
}

// Bindings
document.querySelectorAll('.view-tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentView = btn.dataset.view;
  render();
}));
$('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

render();

}
