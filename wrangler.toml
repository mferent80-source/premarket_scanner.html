# Workerul conectat la Workers Builds: Google sync + releul Trading 212.
# Deploy din radacina: npx wrangler deploy
# Proxy-ul de piata tt-proxy are configuratia tools/cf-proxy-wrangler.toml.

name = "premarket-scanner-html"
main = "tools/cloud-sync-worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
keep_vars = true

[observability]
enabled = false

# Baza existenta, declarata explicit ca legatura sa ramana la fiecare deploy.
[[d1_databases]]
binding = "CLOUD_DB"
database_name = "trading-tools-sync"
database_id = "e3c26a28-a937-4b13-baa4-4b9befdd202c"
