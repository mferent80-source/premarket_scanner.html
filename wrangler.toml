# Workerul conectat la Workers Builds: Google sync + releul Trading 212.
# Deploy din radacina: npx wrangler deploy
# Proxy-ul de piata tt-proxy are configuratia tools/cf-proxy-wrangler.toml.

name = "premarket-scanner-html"
main = "tools/cloud-sync-worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
keep_vars = true

[observability]
enabled = false

# CLOUD_DB este legat in dashboard la baza EXISTENTA trading-tools-sync.
# Pastram legatura D1, variabilele si secretele la fiecare deploy automat.
# Nu cream o alta baza si nu regeneram CLOUD_ENCRYPTION_KEY.
# metadata suprascrie lista Wrangler: include si tipurile vars/secrets.
[unsafe.metadata]
keep_bindings = ["d1", "plain_text", "json", "secret_text", "secret_key"]
