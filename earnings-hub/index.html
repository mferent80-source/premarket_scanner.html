<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<script src="../lib/theme.js?v=815"></script>
<meta name="theme-color" content="#17150f">
<title>Earnings · Trading Tools</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../lib/plex.css?v=815">
<link rel="stylesheet" href="../lib/tokens.css?v=815">
<style>
/* ══════════════════════════════════════════════════════════════════════════════
   EARNINGS - rescris dupa modelul hub-ului (22.09.2026)

   Calendarul vine din lib/earnings.js, acelasi modul pe care il foloseste fereastra
   „Raporteaza" din hub - acelasi filtru US, aceeasi ordine, deci aceeasi lista.

   Ce NU mai are fata de varianta veche (pastrata la ./clasic.html): istoricul
   reactiilor post-earnings si verdictul insider. Erau lucruri de aprofundat UN
   simbol; asta e calendarul - raspunde la „cine raporteaza si cand", nu la „ce s-a
   intamplat data trecuta".

   Lipsa cheii Finnhub NU se confunda cu „nu raporteaza nimeni": prima inseamna ca
   n-am intrebat, a doua ca am intrebat si n-a fost nimic. Se scriu diferit.
   ══════════════════════════════════════════════════════════════════════════════ */
:root {
  --pl: #17150f; --win: #1e1b14; --win-2: #262218;
  --ink: #f5f3ee; --ink-2: #b8b3a6; --ink-3: #85806f;
  --line: #2f2a20; --acc: #e8a838;
  --sus: var(--tt-pos); --jos: var(--tt-neg);
}
:root[data-theme="light"] {
  --pl: #f4f1ea; --win: #fdfcf9; --win-2: #f3f0e8;
  --ink: #1b1813; --ink-2: #57534a; --ink-3: #7d7869;
  --line: #e2ddd0; --acc: #8a5a00;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--pl); color: var(--ink); font-family: var(--tt-sans);
  font-size: 15px; line-height: 1.45; padding-bottom: 92px;
  -webkit-text-size-adjust: 100%;
}
.w { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
a { color: inherit; }
.top { display: flex; align-items: baseline; gap: 12px; padding: 18px 0 14px; flex-wrap: wrap; }
.top h1 { font-size: 16px; font-weight: 600; margin: 0; }
.top .v { font-family: var(--tt-mono); font-size: 11px; color: var(--ink-3); }
.sp { margin-left: auto; }
.lnk {
  font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 0;
  padding: 4px 0; cursor: pointer; text-decoration: none; border-bottom: 1px solid transparent;
}
.lnk:hover { color: var(--ink); border-bottom-color: var(--line); }

.cap {
  background: var(--win); border-radius: var(--tt-r); border-left: 3px solid var(--acc);
  padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;
}
.cap .kick {
  font-family: var(--tt-mono); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); width: 100%;
}
.cap h2 { font-size: clamp(22px, 2.4vw, 30px); margin: 0; color: var(--acc); letter-spacing: -0.02em; }
.cap p { margin: 0; color: var(--ink-2); flex: 1 1 280px; max-width: 62ch; font-size: 14.5px; }

.zile { display: flex; gap: 8px; padding: 16px 0 4px; flex-wrap: wrap; }
.zile button {
  font: inherit; font-size: 13px; font-family: var(--tt-mono); color: var(--ink-2);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 13px; cursor: pointer;
}
.zile button[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
.zile button:hover { color: var(--ink); }

.zi-cap {
  font-family: var(--tt-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin: 22px 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
.rand {
  display: flex; align-items: baseline; gap: 12px; padding: 9px 0;
  border-bottom: 1px solid var(--line); font-size: 14.5px;
}
.rand:last-child { border-bottom: 0; }
.rand .sym { font-family: var(--tt-mono); font-weight: 600; min-width: 62px; }
.rand .cand { font-size: 12.5px; color: var(--ink-3); }
.rand .est { margin-left: auto; font-family: var(--tt-mono); font-size: 12.5px; color: var(--ink-3); text-align: right; }
.gol { color: var(--ink-3); font-style: italic; padding: 18px 0; }
.gol a { color: var(--acc); }
/* detaliile unui simbol: cum a mers data trecuta. Stau aici, nu pe lista, fiindca
   raspund la „merita sa stau peste raportare?" - o intrebare pe care o pui despre UN
   simbol, dupa ce l-ai gasit in calendar. */
.rand.apasabil { cursor: pointer; }
.rand.apasabil:hover .sym { color: var(--acc); }
.det {
  padding: 4px 0 16px 0; margin-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.det h4 {
  font-family: var(--tt-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; margin: 0 0 8px;
}
.det table { width: 100%; border-collapse: collapse; font-family: var(--tt-mono); font-size: 12.5px; max-width: 620px; }
.det table th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-3); font-weight: 400; padding: 4px 10px 5px 0; border-bottom: 1px solid var(--line);
}
.det table td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.det table .r { text-align: right; }
.det .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; max-width: 70ch; }
.up { color: var(--sus); } .dn { color: var(--jos); }
.nota { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; max-width: 78ch; }
.cheie { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.cheie input {
  font-family: var(--tt-mono); font-size: 13px; flex: 1 1 260px; max-width: 420px;
  background: transparent; color: var(--ink); border: 0; border-bottom: 1px solid var(--line); padding: 5px 0;
}
.cheie input:focus { outline: none; border-bottom-color: var(--acc); }
.cheie button {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--pl); background: var(--acc);
  border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
@media (max-width: 560px) { .w { padding: 0 14px; } .rand .est { display: none; } }
</style>
</head>
<body>
<div class="w">
  <header class="top">
    <h1>Earnings</h1>
    <span class="v" id="ver">v1</span>
    <span class="v" id="laOra"></span>
    <span class="sp"></span>
    <a class="lnk" href="./clasic.html">varianta veche</a>
    <a class="lnk" href="../">← Hub</a>
  </header>

  <section class="cap">
    <div class="kick" id="kick">se încarcă</div>
    <h2 id="titlu">…</h2>
    <p id="dece">Întreb calendarul de raportări.</p>
  </section>

  <div class="zile" id="zile">
    <button data-z="7" aria-pressed="false">7 zile</button>
    <button data-z="14" aria-pressed="true">14 zile</button>
    <button data-z="30" aria-pressed="false">30 zile</button>
  </div>

  <div id="lista"></div>

  <p class="nota" id="nota"></p>
</div>

<script src="../lib/data.js?v=818"></script>
<script src="../lib/finnhub-key.js?v=815"></script>
<script src="../lib/earnings.js?v=815"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let ZILE = 14;

function ziLizibila(iso) {
  try {
    const d = new Date(iso + 'T12:00:00Z');
    const azi = new Date();
    const dif = Math.round((d - new Date(azi.getFullYear(), azi.getMonth(), azi.getDate())) / 86400000);
    const nume = new Intl.DateTimeFormat('ro-RO', { weekday: 'long', day: '2-digit', month: 'long' }).format(d);
    if (dif === 0) return 'astăzi · ' + nume;
    if (dif === 1) return 'mâine · ' + nume;
    return nume;
  } catch (e) { return iso; }
}

function scrie(r) {
  $('laOra').textContent = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (!r.ok) {
    const faraCheie = r.motiv === 'fără cheie';
    $('kick').textContent = 'nu știu';
    $('titlu').textContent = faraCheie ? 'Nu am cheia Finnhub' : 'Nu am putut întreba';
    $('dece').textContent = faraCheie
      ? 'Calendarul de raportări vine de la Finnhub, care cere o cheie. Fără ea nu pot spune nici că raportează cineva, nici că nu.'
      : 'Finnhub nu a răspuns: ' + r.motiv + '.';
    $('lista').innerHTML = faraCheie
      ? '<div class="cheie"><input id="k" type="password" placeholder="cheia Finnhub (gratuită pe finnhub.io/register)" autocomplete="off">'
        + '<button id="salveaza">Salvează</button></div>'
        + '<div class="gol">Cheia se salvează doar în browserul tău și e folosită de toată suita.</div>'
      : '<div class="gol">nu știu</div>';
    const b = $('salveaza');
    if (b) b.addEventListener('click', () => {
      const v = ($('k').value || '').trim();
      if (!v) return;
      try { localStorage.setItem('finnhub_api_key', v); } catch (e) {}
      adu();
    });
    $('nota').textContent = '';
    return;
  }

  const items = r.items || [];
  $('kick').textContent = 'următoarele ' + ZILE + ' zile';
  if (!items.length) {
    $('titlu').textContent = 'Nicio raportare';
    $('dece').textContent = 'Am întrebat și nu e nimic programat în fereastra asta.';
    $('lista').innerHTML = '<div class="gol">Nimic de aici până peste ' + ZILE + ' zile.</div>';
    return;
  }
  $('titlu').textContent = items.length + (items.length === 1 ? ' raportare' : ' raportări');
  const azi = items.filter((e) => e.date === new Date().toISOString().slice(0, 10)).length;
  $('dece').textContent = azi
    ? azi + ' chiar astăzi. O poziție ținută peste o raportare e un pariu pe un rezultat pe care nu-l cunoști.'
    : 'O poziție ținută peste o raportare e un pariu pe un rezultat pe care nu-l cunoști. Verifică-le înainte să intri.';

  // grupate pe zi: data se citeste o singura data, nu pe fiecare rand
  const peZi = {};
  items.forEach((e) => { (peZi[e.date] = peZi[e.date] || []).push(e); });
  $('lista').innerHTML = Object.keys(peZi).sort().map((zi) =>
    '<div class="zi-cap">' + esc(ziLizibila(zi)) + ' · ' + peZi[zi].length + '</div>'
    + peZi[zi].map((e) => {
        const est = [];
        if (e.epsEstimate != null) est.push('EPS aşteptat ' + e.epsEstimate);
        if (e.revenueEstimate != null) est.push('venit ' + (e.revenueEstimate / 1e9).toFixed(2) + ' mld');
        return '<div class="rand apasabil" data-sym="' + esc(e.symbol) + '"><span class="sym">' + esc(e.symbol) + '</span>'
          + '<span class="cand">' + esc(EARN.cand(e)) + '</span>'
          + '<span class="est">' + esc(est.join(' · ')) + '</span></div>';
      }).join('')
  ).join('');

  $('nota').textContent = 'Sursa: Finnhub /calendar/earnings. Lista e filtrată la simboluri americane '
    + '(1-5 litere, fără sufix de bursă) care au cel puțin o estimare publicată — altfel ar veni peste o mie '
    + 'de raportări din toată lumea, între care nu găsești ce te interesează. '
    + 'Click pe un simbol: cum a mers la ultimele 8 raportări şi cât s-a mişcat preţul atunci.';
}


// ══════════════════════════════════════════════════════════════════════════════
//  CUM A MERS DATA TRECUTA (click pe un simbol)
//
//  Istoricul reactiilor post-earnings, intors dupa rescriere. Locul lui e aici, la
//  cerere: raspunde la „merita sa stau peste raportare?", intrebare pe care o pui
//  despre UN simbol, nu despre toata lista.
//
//  Reactia se masoara intre inchiderea de DINAINTE si cea de DUPA ziua raportarii,
//  tinand cont daca a raportat inainte de deschidere (bmo) sau dupa inchidere (amc).
//  Cand ziua nu se gaseste in istoricul de preturi, randul scrie „nu stiu" - nu zero.
// ══════════════════════════════════════════════════════════════════════════════
let desfacut = null;

function inchideDet() {
  document.querySelectorAll('.det').forEach((d) => d.remove());
  desfacut = null;
}

async function desfa(sym, rand) {
  if (desfacut === sym) { inchideDet(); return; }
  inchideDet();
  desfacut = sym;

  const d = document.createElement('div');
  d.className = 'det';
  d.innerHTML = '<h4>' + esc(sym) + ' · cum a mers data trecută</h4><div id="d-h">întreb…</div>';
  rand.after(d);

  const r = await EARN.istoric(sym, { ani: 2 });
  const el = document.getElementById('d-h');
  if (!el) return;

  if (!r.ok) { el.innerHTML = '<span class="sub">nu știu — ' + esc(r.motiv) + '</span>'; return; }
  if (!r.items.length) { el.innerHTML = '<span class="sub">nicio raportare găsită în ultimii 2 ani</span>'; return; }

  const cuReactie = r.items.filter((x) => x.reactie != null);
  const medie = cuReactie.length
    ? cuReactie.reduce((a, x) => a + Math.abs(x.reactie), 0) / cuReactie.length : null;

  el.innerHTML = '<table><thead><tr><th>Când</th><th>Ora</th>'
    + '<th class="r">EPS aşteptat</th><th class="r">EPS real</th>'
    + '<th class="r">Surpriză</th><th class="r">Reacţia preţului</th></tr></thead><tbody>'
    + r.items.map((x) => '<tr>'
        + '<td>' + esc(x.date) + '</td>'
        + '<td style="color:var(--ink-3)">' + esc(x.hour === 'amc' ? 'după închidere' : x.hour === 'bmo' ? 'înainte' : (x.hour || '—')) + '</td>'
        + '<td class="r">' + (x.epsEstimate != null ? x.epsEstimate : '—') + '</td>'
        + '<td class="r">' + (x.epsActual != null ? x.epsActual : '—') + '</td>'
        + '<td class="r ' + (x.surpriza == null ? '' : x.surpriza >= 0 ? 'up' : 'dn') + '">'
          + (x.surpriza == null ? '—' : (x.surpriza > 0 ? '+' : '') + x.surpriza.toFixed(0) + '%') + '</td>'
        + '<td class="r ' + (x.reactie == null ? '' : x.reactie >= 0 ? 'up' : 'dn') + '">'
          + (x.reactie == null ? 'nu ştiu' : (x.reactie > 0 ? '+' : '') + x.reactie.toFixed(2) + '%') + '</td>'
        + '</tr>').join('')
    + '</tbody></table>'
    + '<div class="sub">'
    + (medie != null
        ? 'În medie, preţul s-a mişcat <b>' + medie.toFixed(1) + '%</b> în ziua raportării (indiferent de direcţie), pe '
          + cuReactie.length + ' din ' + r.items.length + ' raportări. '
        : '')
    + 'Reacţia e măsurată între închiderea dinainte şi cea de după ziua raportării, ţinând cont dacă a raportat '
    + 'înainte de deschidere sau după închidere. O poziţie ţinută peste o astfel de zi riscă exact atât.</div>';
}

document.addEventListener('click', (e) => {
  const r = e.target.closest && e.target.closest('.rand[data-sym]');
  if (r) desfa(r.dataset.sym, r);
});

async function adu() {
  $('kick').textContent = 'întreb…';
  scrie(await EARN.calendar({ zile: ZILE }));
}

document.querySelectorAll('#zile button').forEach((b) => {
  b.addEventListener('click', () => {
    ZILE = +b.dataset.z;
    desfacut = null;
    document.querySelectorAll('#zile button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    adu();
  });
});

try {
  const v = localStorage.getItem('tt_sw_version') || localStorage.getItem('tt_suite_version');
  if (v) $('ver').textContent = v;
} catch (e) {}

adu();
</script>
<script src="../lib/suite-version.js?v=815"></script>
<script src="../nav.js?v=682" data-nav-root="../"></script>
</body>
</html>
