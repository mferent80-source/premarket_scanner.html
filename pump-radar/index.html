<style>
/* ══════════════════════════════════════════════════════════════════════════════
   PUMP RADAR - rescris dupa modelul hub-ului (22.09.2026)

   Pagina veche avea scor 188 la masuratoare: 96 de lucruri apasabile pe primul
   ecran si 25 de culori. Aici sunt sub 20, pe aceiasi tokeni ca hub-ul.

   Regula de sugestie NU e rescrisa: vine din lib/pump.js, acelasi modul pe care il
   foloseste fereastra din hub. Doua ecrane, o singura regula.

   Ce NU mai are fata de varianta veche (pastrata in git, `git show`): verdictul
   insider, nota AI, backtest-ul si randul care se desfacea la click. Erau lucruri
   de APROFUNDAT un simbol; radarul e pentru a-l GASI. Daca vreunul lipseste cu
   adevarat, se pune inapoi - dar intai sa se vada daca lipseste.
   ══════════════════════════════════════════════════════════════════════════════ */
:root {
  --pl: #17150f; --win: #1e1b14; --win-2: #262218;
  --ink: #f5f3ee; --ink-2: #b8b3a6; --ink-3: #85806f;
  --line: #2f2a20; --acc: #e8a838;
  --sus: var(--tt-pos); --jos: var(--tt-neg);
}
:root[data-theme="light"] {
  --pl: #f4f1ea; --win: #fdfcf9; --win-2: #f3f0e8;
  --ink: #1b1813; --ink-2: #57534a; --ink-3: #7d7869;
  --line: #e2ddd0; --acc: #8a5a00;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--pl); color: var(--ink); font-family: var(--tt-sans);
  font-size: 15px; line-height: 1.45; padding-bottom: 92px;
  -webkit-text-size-adjust: 100%;
}
.w { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
a { color: inherit; }
.top { display: flex; align-items: baseline; gap: 12px; padding: 18px 0 14px; flex-wrap: wrap; }
.top h1 { font-size: 16px; font-weight: 600; margin: 0; }
.top .v { font-family: var(--tt-mono); font-size: 11px; color: var(--ink-3); }
.sp { margin-left: auto; }
.lnk {
  font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 0;
  padding: 4px 0; cursor: pointer; text-decoration: none; border-bottom: 1px solid transparent;
}
.lnk:hover { color: var(--ink); border-bottom-color: var(--line); }

.cap {
  background: var(--win); border-radius: var(--tt-r); border-left: 3px solid var(--acc);
  padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;
}
.cap .kick {
  font-family: var(--tt-mono); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); width: 100%;
}
.cap h2 { font-size: clamp(22px, 2.4vw, 30px); margin: 0; color: var(--acc); letter-spacing: -0.02em; }
.cap p { margin: 0; color: var(--ink-2); flex: 1 1 280px; max-width: 62ch; font-size: 14.5px; }

.praguri { display: flex; flex-wrap: wrap; gap: 14px 22px; padding: 16px 0 6px; align-items: flex-end; }
.pr label { display: block; font-family: var(--tt-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.pr input {
  font-family: var(--tt-mono); font-size: 15px; width: 86px; margin-top: 3px;
  background: transparent; color: var(--ink); border: 0; border-bottom: 1px solid var(--line);
  padding: 3px 0;
}
.pr input:focus { outline: none; border-bottom-color: var(--acc); }

table.t { width: 100%; border-collapse: collapse; font-family: var(--tt-mono); font-size: 13px; margin-top: 8px; }
table.t th {
  text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; padding: 8px 10px 7px 0; border-bottom: 1px solid var(--line);
}
table.t td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.t tr:hover td { background: var(--win); }
table.t .r { text-align: right; }
.up { color: var(--sus); } .dn { color: var(--jos); }
.act { font-size: 11.5px; letter-spacing: .04em; }
.act.buy { color: var(--sus); font-weight: 600; }
.act.watch { color: var(--sus); opacity: .78; }
.act.avoid { color: var(--jos); font-weight: 600; }
.act.wait, .act.skip { color: var(--ink-3); }
.stea { width: 22px; color: var(--ink-3); cursor: pointer; user-select: none; font-size: 14px; }
.stea.on { color: var(--acc); }
.stea:hover { color: var(--acc); }
.lnk[aria-pressed="true"] { color: var(--acc); border-bottom-color: var(--acc); }
.gol { color: var(--ink-3); font-style: italic; padding: 18px 0; }
.miss { border-left: 2px solid var(--acc); padding: 9px 0 9px 13px; margin-top: 14px; font-size: 13.5px; color: var(--ink-2); }
/* randul care se desface: aici stau lucrurile de APROFUNDAT un simbol - backtest,
   insider, nota AI. Nu pe lista, ca sa ramana citibila dintr-o privire. */
tr.desfacut td { background: var(--win); border-bottom: 1px solid var(--line); padding: 0; }
.det { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px 26px; padding: 16px 0 20px; }
.det h4 {
  font-family: var(--tt-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; margin: 0 0 8px;
}
.det table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--tt-mono); }
.det table td, .det table th {
  padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line);
  text-align: left; font-weight: 400; font-variant-numeric: tabular-nums;
}
.det table th { color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.det .r { text-align: right; }
.verdict-bt { font-size: 12.5px; line-height: 1.4; margin-top: 8px; color: var(--ink-2); }
.verdict-bt.good { color: var(--sus); } .verdict-bt.bad { color: var(--jos); } .verdict-bt.warn { color: var(--acc); }
.ins-v { font-family: var(--tt-mono); font-size: 13px; }
.ins-v.bull { color: var(--sus); } .ins-v.bear { color: var(--jos); } .ins-v.neut { color: var(--ink-3); }
.mic {
  font: inherit; font-size: 12px; color: var(--ink-2); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.mic:hover { border-color: var(--acc); color: var(--acc); }
.ai-text { font-size: 13px; color: var(--ink-2); line-height: 1.5; white-space: pre-wrap; margin-top: 8px; }
.sub { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
.nota { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12.5px; max-width: 78ch; }
@media (max-width: 620px) {
  .w { padding: 0 14px; }
  table.t .ascunde-tel { display: none; }
}
</style>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const ro = (x, z) => (x == null || !isFinite(x)) ? '—'
  : x.toLocaleString('ro-RO', { minimumFractionDigits: z, maximumFractionDigits: z });
const pct = (x) => x == null ? '—' : (x > 0 ? '+' : '') + ro(x, 2) + '%';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const ETICHETA = { buy: 'CUMPĂRĂ', watch: 'URMĂREȘTE', avoid: 'EVITĂ', wait: 'așteaptă', skip: '—' };
let S = { lista: [], lipsa: [] };

function scrie() {
  const l = S.lista || [];
  const interesante = l.filter((x) => ['buy', 'watch', 'avoid'].includes(x.act));

  $('laOra').textContent = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (!l.length) {
    $('kick').textContent = 'nu știu';
    $('titlu').textContent = 'Scanul nu a răspuns';
    $('dece').textContent = 'Nu am primit date pentru niciun simbol, deci nu pot spune nici că se mișcă ceva, nici că nu.';
  } else if (!interesante.length) {
    $('kick').textContent = l.length + ' simboluri scanate';
    $('titlu').textContent = 'Nu se mișcă nimic';
    $('dece').textContent = 'Niciunul nu trece pragurile de mai jos. Asta e răspunsul obișnuit în afara orelor de tranzacționare și în zilele liniștite.';
  } else {
    const buy = interesante.filter((x) => x.act === 'buy').length;
    $('kick').textContent = l.length + ' simboluri scanate';
    $('titlu').textContent = interesante.length + (interesante.length === 1 ? ' se mișcă' : ' se mișcă');
    $('dece').textContent = buy
      ? buy + ' cu semnal de cumpărare, restul de urmărit. Lista e sortată după cât de tare se mișcă.'
      : 'Niciunul nu are confirmare de volum, deci niciun semnal de cumpărare: doar de urmărit.';
  }

  if (!l.length) { $('tabel').innerHTML = '<div class="gol">nu știu</div>'; }
  else {
    $('tabel').innerHTML = '<table class="t"><thead><tr>'
      + '<th></th><th>Simbol</th><th>Sugestie</th><th class="r">Preț</th>'
      + '<th class="r">5 min</th><th class="r">Ziua</th>'
      + '<th class="r ascunde-tel">RSI</th><th class="r ascunde-tel">Intensitate</th>'
      + '</tr></thead><tbody>'
      + l.map((x) => '<tr id="r-' + esc(x.symbol) + '" data-sym="' + esc(x.symbol) + '" style="cursor:pointer" title="click pentru detalii">'
          + '<td class="stea' + (inWl(x.symbol) ? ' on' : '') + '" data-wl="' + esc(x.symbol) + '" title="urmăresc / nu urmăresc">'
            + (inWl(x.symbol) ? '★' : '☆') + '</td>'
          + '<td style="font-weight:600">' + esc(x.symbol) + '</td>'
          + '<td class="act ' + x.act + '">' + esc(ETICHETA[x.act] || x.act) + '</td>'
          + '<td class="r">' + ro(x.price, 2) + '</td>'
          + '<td class="r ' + (x.m5 >= 0 ? 'up' : 'dn') + '">' + pct(x.m5) + '</td>'
          + '<td class="r ' + (x.chgDay >= 0 ? 'up' : 'dn') + '">' + pct(x.chgDay) + '</td>'
          + '<td class="r ascunde-tel">' + (x.rsi != null ? ro(x.rsi, 0) : '—') + '</td>'
          + '<td class="r ascunde-tel">' + x.heat + '</td>'
          + '</tr>').join('')
      + '</tbody></table>';
  }

  $('lipsa').innerHTML = (S.lipsa && S.lipsa.length)
    ? '<p class="miss"><b>Nu am putut afla tot:</b> ' + esc(S.lipsa.map((x) => x.ce).join(' · ')) + '.</p>'
    : '';

  const p = PUMP.praguri();
  $('nota').textContent = 'Sugestia se compune din: mișcarea ultimei bare de 5 minute închise (prag '
    + ro(p.thrMove, 1) + '%), variația zilei și RSI. Bara în formare e scoasă, altfel cifra ar sări '
    + 'la fiecare reîmprospătare. Volumul nu vine în acest tip de cerere, deci semnalele care cer '
    + 'confirmare de volum nu pot apărea aici — pentru ele e nevoie de o cerere per simbol. '
    + 'Click pe un rând: backtest-ul semnalului, ce fac cei din interior și, la buton, părerea AI.';
}


// ══════════════════════════════════════════════════════════════════════════════
//  RANDUL CARE SE DESFACE
//
//  Aici s-au intors lucrurile scoase la rescriere: backtest-ul semnalului, verdictul
//  insider si nota AI. Locul lor e AICI, nu pe lista: sunt raspunsuri la „de ce" si
//  „merita?", pe care le pui despre UN simbol, dupa ce l-ai gasit. Pe lista ar fi
//  transformat 24 de randuri in 24 de dosare.
//
//  Nimic nu se cere pana nu apesi: backtest-ul foloseste barele deja aduse de scan,
//  insider-ul e o cerere per simbol, iar AI costa bani - deci sta in spatele unui buton.
// ══════════════════════════════════════════════════════════════════════════════
let desfacut = null;

function inchideDesfacut() {
  document.querySelectorAll('tr.desfacut').forEach((t) => t.remove());
  desfacut = null;
}

function desfa(sym) {
  if (desfacut === sym) { inchideDesfacut(); return; }
  inchideDesfacut();
  const rand = document.getElementById('r-' + sym);
  const x = (S.lista || []).find((r) => r.symbol === sym);
  if (!rand || !x) return;
  desfacut = sym;

  const tr = document.createElement('tr');
  tr.className = 'desfacut';
  tr.innerHTML = '<td colspan="8"><div class="det">'
    + '<div><h4>Semnalul a mers în trecut?</h4><div id="d-bt">se calculează…</div></div>'
    + '<div><h4>Ce fac cei din interior</h4><div id="d-ins">…</div></div>'
    + '<div><h4>Părerea AI</h4><div id="d-ai"></div></div>'
    + '</div></td>';
  rand.after(tr);

  deseneazaBacktest(x);
  deseneazaInsider(x);
  deseneazaAI(x);
}

/** Backtest pe barele de 5 minute deja aduse de scan. Semnalul e EXACT pragul din
    pagina. Randamentul e BRUT si in-sample - scris pe ecran, ca cifra sa nu para
    mai buna decat e. */
function deseneazaBacktest(x) {
  const el = $('d-bt');
  if (!el) return;
  if (!window.BT || !BT.signal) { el.innerHTML = '<span class="sub">modulul de backtest nu e încărcat</span>'; return; }
  const closes = x.closes || [];
  if (closes.length < 40) {
    el.innerHTML = '<span class="sub">prea puține bare (' + closes.length + ') ca să însemne ceva</span>';
    return;
  }
  const ohlc = closes.map((c) => ({ c }));
  const thr = PUMP.praguri().thrMove;
  const sigFn = (b, i) => ((b[i].c / b[i - 1].c - 1) * 100 >= thr) ? 1 : 0;
  let best = null;
  let rows = '';
  for (const H of [3, 6, 12]) {
    const res = BT.signal(ohlc, sigFn, { horizon: H });
    if (!best || Math.abs(res.t) > Math.abs(best.t)) best = res;
    rows += '<tr><td>' + (H * 5) + ' min</td>'
      + '<td class="r">' + res.n + '</td>'
      + '<td class="r ' + (res.avgPct > 0 ? 'up' : 'dn') + '">' + (res.avgPct >= 0 ? '+' : '') + res.avgPct.toFixed(2) + '%</td>'
      + '<td class="r">' + res.hitPct.toFixed(0) + '%</td>'
      + '<td class="r">' + res.t.toFixed(2) + '</td>'
      + '<td class="r ' + (res.edgePct > 0 ? 'up' : 'dn') + '">' + (res.edgePct >= 0 ? '+' : '') + res.edgePct.toFixed(2) + '%</td></tr>';
  }
  const v = BT.verdict(best);
  el.innerHTML = '<div class="sub">Semnal: bară 5 min ≥ +' + ro(thr, 1) + '% · ' + closes.length + ' bare · randament BRUT, in-sample</div>'
    + '<table><thead><tr><th>Orizont</th><th class="r">n</th><th class="r">medie</th>'
    + '<th class="r">hit</th><th class="r">t</th><th class="r">față de piață</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>'
    + '<div class="verdict-bt ' + v.cls + '">' + esc(v.text) + '</div>';
}

/** Verdictul insider: tranzactiile raportate de conducere, ultimele 90 de zile.
    Cere cheie Finnhub - fara ea spunem ca n-am intrebat, nu ca nu e nimic. */
async function deseneazaInsider(x) {
  const el = $('d-ins');
  if (!el) return;
  if (!window.INS || !INS.fetchTx) { el.innerHTML = '<span class="sub">modulul insider nu e încărcat</span>'; return; }
  let cheie = '';
  try { cheie = localStorage.getItem('finnhub_api_key') || ''; } catch (e) {}
  if (!cheie) {
    el.innerHTML = '<span class="sub">nu știu — cere cheia Finnhub, pusă în <a href="../earnings-hub/" style="color:var(--acc)">Earnings</a></span>';
    return;
  }
  el.textContent = 'întreb…';
  try {
    const rows = await INS.fetchTx(x.symbol, { days: 90 });
    if (!rows || !rows.length) { el.innerHTML = '<span class="sub">nicio tranzacție raportată în 90 de zile</span>'; return; }
    const a = INS.analyze(rows, { topN: 5 });
    if (!a) { el.innerHTML = '<span class="sub">nu am putut citi răspunsul</span>'; return; }
    const et = { bull: 'CUMPĂRĂ', bear: 'VÂND', neut: 'echilibrat' };
    el.innerHTML = '<div class="ins-v ' + a.verdict + '">' + (et[a.verdict] || a.verdict) + '</div>'
      + '<div class="sub">' + a.buys + ' cumpărări · ' + a.sells + ' vânzări, ultimele 90 de zile</div>'
      + (a.top && a.top.length
        ? '<table><tbody>' + a.top.slice(0, 5).map((t) =>
            '<tr><td>' + esc((t.name || '?').slice(0, 22)) + '</td>'
            + '<td class="r ' + (t.buy ? 'up' : 'dn') + '">' + (t.buy ? '+' : '') + (t.change || 0).toLocaleString('ro-RO') + '</td>'
            + '<td class="r" style="color:var(--ink-3)">' + esc(t.date || '') + '</td></tr>').join('')
          + '</tbody></table>'
        : '');
  } catch (e) {
    el.innerHTML = '<span class="sub">nu am putut întreba: ' + esc(e.message || e) + '</span>';
  }
}

/** Nota AI, DOAR la buton: fiecare apasare costa bani, deci nu se cere singura. */
function deseneazaAI(x) {
  const el = $('d-ai');
  if (!el) return;
  if (!window.AI || !AI.complete) { el.innerHTML = '<span class="sub">modulul AI nu e încărcat</span>'; return; }
  if (!AI.hasKey || !AI.hasKey()) {
    el.innerHTML = '<span class="sub">nu știu — cere cheia Anthropic (⚙ în pagina Macro)</span>';
    return;
  }
  el.innerHTML = '<button class="mic" id="b-ai">întreabă despre ' + esc(x.symbol) + '</button>'
    + '<div class="sub">costă un apel; nu se cere singur</div>';
  $('b-ai').addEventListener('click', async () => {
    $('b-ai').disabled = true;
    $('b-ai').textContent = 'întreb…';
    const p = PUMP.praguri();
    const intrebare = 'Ești un trader disciplinat. Date reale ACUM pentru ' + x.symbol + ': '
      + 'ultima bară de 5 minute ' + x.m5.toFixed(2) + '%, variația zilei ' + x.chgDay.toFixed(2) + '%, '
      + 'RSI ' + (x.rsi != null ? x.rsi.toFixed(0) : 'necunoscut') + ', preț ' + x.price.toFixed(2) + ' USD. '
      + 'Pragul de detecție e ' + p.thrMove + '%. În maximum 60 de cuvinte, în română: merită urmărit acum '
      + 'sau e zgomot, și ce ar invalida ideea? Nu inventa cifre pe care nu ți le-am dat.';
    try {
      const t = await AI.complete({ messages: [{ role: 'user', content: intrebare }], max_tokens: 300 });
      el.innerHTML = '<div class="ai-text">' + esc(t) + '</div>'
        + '<div class="sub">scris de un model, pe cifrele de mai sus. Nu e sfat de investiții.</div>';
    } catch (e) {
      el.innerHTML = '<span class="sub">nu a răspuns: ' + esc(e.message || e) + '</span>';
    }
  });
}

document.addEventListener('click', (e) => {
  const tr = e.target.closest && e.target.closest('tr[data-sym]');
  if (tr) desfa(tr.dataset.sym);
});


// ══════════════════════════════════════════════════════════════════════════════
//  CE TE ANUNTA CAND NU ESTI PE PAGINA
//
//  Toate astea existau in varianta veche si au disparut la rescriere. Se intorc
//  legate de modulele suitei (lib/watchlist, sound, notifications, telegram,
//  poll-wake), nu rescrise aici: o alerta trimisa de doua ecrane diferite trebuie
//  sa arate la fel si sa citeasca aceeasi configurare.
//
//  Se anunta DOAR semnalele NOI: un simbol care era deja `buy` la scanul trecut nu
//  mai suna o data. Altfel, un auto-scan la un minut ar deveni o alarma continua,
//  si primul lucru pe care l-ai face ar fi s-o inchizi.
// ══════════════════════════════════════════════════════════════════════════════
const VAZUTE_KEY = 'pump_radar_seen';
const VAZUTE_TTL = 30 * 60000;   // dupa 30 de minute, acelasi semnal poate suna iar

function vazuteCitite() {
  try { return JSON.parse(localStorage.getItem(VAZUTE_KEY) || '{}'); } catch (e) { return {}; }
}
function vazuteScrise(v) {
  try { localStorage.setItem(VAZUTE_KEY, JSON.stringify(v)); } catch (e) {}
}

function inWl(sym) {
  try { return !!(window.WL && WL.has && WL.has(sym)); } catch (e) { return false; }
}

/** Semnalele care merita anuntate: buy / avoid, si doar daca nu le-am anuntat
    recent. Intoarce lista lor si marcheaza-le ca vazute. */
function semnaleNoi(lista) {
  const v = vazuteCitite();
  const acum = Date.now();
  for (const k of Object.keys(v)) if (acum - v[k] > VAZUTE_TTL) delete v[k];
  const noi = [];
  for (const x of lista) {
    if (x.act !== 'buy' && x.act !== 'avoid') continue;
    const cheie = x.symbol + '|' + x.act;
    if (v[cheie]) continue;
    v[cheie] = acum;
    noi.push(x);
  }
  vazuteScrise(v);
  return noi;
}

async function anunta(noi) {
  if (!noi.length) return;
  const cuStea = noi.filter((x) => inWl(x.symbol));
  // Sunetul suna o data pentru tot lotul, nu o data pe simbol.
  try { if (window.SND && SND.isEnabled && SND.isEnabled()) SND.beep(); } catch (e) {}
  try {
    if (window.NT && NT.isOn && NT.isOn()) {
      const t = noi.length === 1
        ? noi[0].symbol + ' · ' + (ETICHETA[noi[0].act] || noi[0].act)
        : noi.length + ' semnale noi';
      NT.show('Pump Radar', {
        body: noi.slice(0, 5).map((x) => x.symbol + ' ' + (ETICHETA[x.act] || '') + ' ' + pct(x.m5)).join('\n'),
        tag: 'pump-radar',
      });
      void t;
    }
  } catch (e) {}
  try {
    if (window.TG && TG.send) {
      const linii = noi.slice(0, 8).map((x) =>
        (inWl(x.symbol) ? '⭐ ' : '') + x.symbol + ' · ' + (ETICHETA[x.act] || x.act)
        + ' · 5min ' + pct(x.m5) + ' · zi ' + pct(x.chgDay));
      await TG.send('<b>Pump Radar</b>\n' + linii.join('\n'));
    }
  } catch (e) {}
  void cuStea;
}

// ── butoanele de sus ──────────────────────────────────────────────────────────
function pictaButoane() {
  const seteaza = (id, on) => {
    const b = $(id);
    if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  };
  try { seteaza('sunet', window.SND && SND.isEnabled && SND.isEnabled()); } catch (e) {}
  try { seteaza('notif', window.NT && NT.isOn && NT.isOn()); } catch (e) {}
  try { seteaza('tg', window.TG && TG.getConfig && TG.getConfig().enabled); } catch (e) {}
  seteaza('auto', !!autoId);
}

$('sunet').addEventListener('click', () => {
  try { if (window.SND && SND.toggle) { SND.toggle(); SND.beep(); } } catch (e) {}
  pictaButoane();
});
$('notif').addEventListener('click', async () => {
  try {
    if (!window.NT) return;
    if (NT.isOn()) NT.disable(); else await NT.enable();
  } catch (e) {}
  pictaButoane();
});
$('tg').addEventListener('click', async () => {
  if (!window.TG) return;
  const c = TG.getConfig();
  if (!c.token || !c.chatId) {
    // Fara token nu are rost sa pornim nimic: pagina spune unde se pune.
    alert('Telegram nu e configurat. Pune tokenul și chat ID-ul în pagina Alerte, apoi revino.');
    return;
  }
  TG.setConfig({ ...c, enabled: !c.enabled });
  pictaButoane();
  if (!c.enabled) { try { await TG.test(); } catch (e) {} }
});

// ── auto-scan ─────────────────────────────────────────────────────────────────
// La un minut: destul cat sa prinzi o miscare de 5 minute, dar nu atat de des incat
// sa ceri aceleasi date de 60 de ori pe ora degeaba.
const AUTO_MS = 60000;
let autoId = null;

function porneșteAuto() {
  if (autoId) return;
  autoId = setInterval(() => { if (!document.hidden) scaneaza(); }, AUTO_MS);
  pictaButoane();
}
function opreșteAuto() {
  if (autoId) clearInterval(autoId);
  autoId = null;
  pictaButoane();
}
$('auto').addEventListener('click', () => {
  if (autoId) opreșteAuto(); else { porneșteAuto(); scaneaza(); }
  try { localStorage.setItem('pump_auto', autoId ? '1' : '0'); } catch (e) {}
});

// Trezire dupa ce laptopul a dormit sau tabul a stat ascuns: fara asta,
// `setInterval` poate ramane blocat si pagina arata cifre vechi fara sa spuna.
try {
  if (window.PollWake && PollWake.bind) {
    PollWake.bind({
      intervalMs: AUTO_MS,
      getBusy: () => false,
      setBusy: () => {},
      poll: () => { if (autoId) scaneaza(); },
      schedule: () => {},
    });
  }
} catch (e) {}

// ── steaua de watchlist ───────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const st = e.target.closest && e.target.closest('[data-wl]');
  if (!st) return;
  e.stopPropagation();   // sa nu desfaca randul in acelasi timp
  const sym = st.dataset.wl;
  try { if (window.WL && WL.toggle) WL.toggle(sym); } catch (err) {}
  st.classList.toggle('on', inWl(sym));
  st.textContent = inWl(sym) ? '★' : '☆';
}, true);

async function scaneaza() {
  $('kick').textContent = 'scanez…';
  const r = await PUMP.scan();
  S = { lista: r.lista, lipsa: r.lipsa, regim: r.regim };
  desfacut = null;   // datele de sub el s-au schimbat
  scrie();
  try { await anunta(semnaleNoi(r.lista || [])); } catch (e) {}
}

function salveazaPraguri() {
  const p = PUMP.praguri();
  const nou = {
    thrMove: parseFloat($('thrMove').value) || p.thrMove,
    thrVol: p.thrVol,
    thrPrice: parseFloat($('thrPrice').value) || p.thrPrice,
  };
  try { localStorage.setItem('pump_radar_cfg', JSON.stringify(nou)); } catch (e) {}
  scaneaza();
}

const p0 = PUMP.praguri();
$('thrMove').value = p0.thrMove;
$('thrPrice').value = p0.thrPrice;
$('thrMove').addEventListener('change', salveazaPraguri);
$('thrPrice').addEventListener('change', salveazaPraguri);
$('reia').addEventListener('click', scaneaza);

try {
  const v = localStorage.getItem('tt_sw_version') || localStorage.getItem('tt_suite_version');
  if (v) $('ver').textContent = v;
} catch (e) {}

pictaButoane();
try { if (localStorage.getItem('pump_auto') === '1') porneșteAuto(); } catch (e) {}

scaneaza();
</script>
