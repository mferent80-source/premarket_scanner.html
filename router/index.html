<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧭 Regime Router — Trading Tools</title>
<meta name="theme-color" content="#0b0f17">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0f17;--panel:#141a28;--panel2:#1d2537;--b1:#2a3247;--t1:#f0f4fa;--t2:#cdd5e2;--t3:#a3adc1;--accent:#5bb0ff;--bull:#22d66b;--bear:#ff4d4d;--gold:#ffd86b;--r:12px;--rs:8px;--mono:'DM Mono',monospace;--head:'Sora',sans-serif;color-scheme:dark}
body{font-family:var(--head);background:var(--bg);color:var(--t1);padding:12px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border:1px solid var(--b1);border-radius:var(--r);margin-bottom:14px;background:var(--panel)}
header h1{font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:auto}
.nav-link{background:var(--panel2);border:1px solid var(--b1);padding:7px 12px;border-radius:var(--rs);color:var(--t1);text-decoration:none;font-size:12px;font-weight:700}
.plan{font-size:28px;font-weight:900;text-align:center;padding:24px;border-radius:var(--r);margin-bottom:12px;border:2px solid var(--accent);background:rgba(91,176,255,.1)}
.plan.stay{border-color:var(--bear);background:rgba(255,77,77,.1);color:var(--bear)}
.panel{background:var(--panel);border:1px solid var(--b1);border-radius:var(--r);padding:14px;margin-bottom:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;font-family:var(--mono);font-size:12px}
.meta div{background:var(--panel2);padding:10px;border-radius:var(--rs);border:1px solid var(--b1)}
textarea{width:100%;min-height:200px;background:var(--panel2);border:1px solid var(--b1);color:var(--t1);font-family:var(--mono);font-size:11px;padding:10px;border-radius:var(--rs)}
.btn{background:var(--accent);border:none;color:#000;padding:8px 14px;border-radius:var(--rs);font-weight:800;cursor:pointer;margin-top:8px}
.note{font-family:var(--mono);font-size:10px;color:var(--t3);line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🧭 Regime Router</h1>
  <button class="nav-link" id="btnEval" style="cursor:pointer;font-family:inherit">🔄 Re-evaluează</button>
  <a class="nav-link" href="../governor/">🛑 Governor</a>
  <a class="nav-link" href="../">← Hub</a>
</header>

<div id="planBox" class="plan">—</div>
<div class="panel"><div class="meta" id="meta"></div><ul id="reasons" style="margin-top:12px;color:var(--t2);font-size:13px;padding-left:18px"></ul></div>

<div class="panel">
  <h2 style="font-size:13px;margin-bottom:8px">📋 Playbook (JSON rules — ordine = prioritate)</h2>
  <textarea id="rulesJson"></textarea>
  <button class="btn" id="btnSave">💾 Salvează playbook</button>
  <button class="btn" id="btnReset" style="background:var(--panel2);color:var(--t2);margin-left:6px">↺ Default</button>
  <p class="note">Override explicit în journal: tag <code>broke-rules</code>. Deschide macro-dashboard dacă regim/danger lipsesc.</p>
</div>

<script src="../lib/journal.js?v=6"></script>
<script src="../lib/governor.js?v=1"></script>
<script src="../lib/router.js?v=1"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
function show(){
  const p = RT.evaluate();
  const box = $('planBox');
  box.textContent = p.strategy;
  box.className = 'plan' + (p.strategy === 'STAY OUT' ? ' stay' : '');
  $('meta').innerHTML = [
    ['Regim', p.regime],
    ['Danger', p.danger != null ? p.danger + '/100' : '—'],
    ['Sizing ×', String(p.sizingMult)],
    ['Max trades', String(p.maxTrades)],
    ['Preset', p.chartHints],
    ['Governor', p.governor || '—']
  ].map(([k,v]) => '<div><div style="color:var(--t3);font-size:10px">' + k + '</div><div style="font-weight:700;margin-top:4px">' + v + '</div></div>').join('');
  $('reasons').innerHTML = (p.reasons || []).map(r => '<li>' + r + '</li>').join('') || '<li style="list-style:none;color:var(--t3)">—</li>';
}
function loadRules(){
  $('rulesJson').value = JSON.stringify(RT.load().rules, null, 2);
}
$('btnEval').onclick = show;
$('btnSave').onclick = () => {
  try {
    const rules = JSON.parse($('rulesJson').value);
    if (!Array.isArray(rules)) throw new Error('rules trebuie să fie array');
    RT.saveRules(rules);
    show();
    alert('Playbook salvat.');
  } catch(e){ alert('JSON invalid: ' + e.message); }
};
$('btnReset').onclick = () => { RT.saveRules(RT.DEFAULT_RULES.slice()); loadRules(); show(); };
loadRules(); show();
})();
</script>
</body>
</html>
