<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- tema suite-wide (light/dark/auto) — sincron in <head>, inainte de CSS-ul paginii -->
<link rel="stylesheet" href="../lib/theme-light.css?v=734">
<script src="../lib/theme.js?v=734"></script>
<title>👻 Signal Shadow Book — Trading Tools</title>
<meta name="theme-color" content="#0b0f17">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/suite-ui.css?v=678">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b11;--panel:#171f30;--panel2:#222c44;--b1:#4a5874;--t1:#fafbfc;--t3:#d0d8e6;--accent:#a78bfa;--bull:#22d66b;--bear:#ff4d4d;--r:12px;--rs:8px;--mono:'DM Mono',monospace;--head:'Sora',sans-serif;color-scheme:dark}
body{font-family:var(--head);background:var(--bg);color:var(--t1);padding:12px;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border:1px solid var(--b1);border-radius:var(--r);margin-bottom:14px;background:var(--panel)}
header h1{font-size:18px;font-weight:800;color:var(--accent);margin-right:auto}
.nav-link{background:var(--panel2);border:1px solid var(--b1);padding:7px 12px;border-radius:var(--rs);color:var(--t1);text-decoration:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.panel{background:var(--panel);border:1px solid var(--b1);border-radius:var(--r);padding:14px;margin-bottom:12px;overflow-x:auto}

/* ── ALINIERE „ZIAR" — topbar panou sticky + bordură de secțiune.
      Tratament minimal (pagină mică): un singur accent (violet, culoarea
      badge-ului paginii) pe cardurile reale. CSS-only, HTML/JS neatinse. ── */
header.suite-cockpit{
  position:sticky; top:0; z-index:60;
  background:var(--topbar-bg); box-shadow:var(--topbar-shadow);
  padding:10px 14px; margin:0 0 12px;
}
.panel{ border-top:3px solid var(--accent); }
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.frm label{font-family:var(--mono);font-size:10px;color:var(--t3);display:flex;flex-direction:column;gap:3px}
.frm input,.frm select,textarea{background:var(--panel2);border:1px solid var(--b1);color:var(--t1);padding:8px;border-radius:var(--rs);font-family:var(--mono)}
textarea{width:100%;min-height:72px;margin-top:8px}
.btn{background:var(--accent);border:none;color:#000;padding:8px 14px;border-radius:var(--rs);font-weight:800;cursor:pointer;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--mono)}
th{color:var(--t3);text-align:right;padding:6px;border-bottom:1px solid var(--b1)}
th:first-child,td:first-child{text-align:left}
td{padding:6px;border-bottom:1px solid rgba(42,50,71,.5);text-align:right}
.note{font-family:var(--mono);font-size:10px;color:var(--t3);line-height:1.5;margin-top:8px}
.useful{color:var(--bull)}.costly{color:var(--bear)}
</style>
</head>
<body class="suite-page">
<div id="capitalRail" data-cd-page="shadow"></div>

<header class="suite-cockpit">
  <h1>👻 Shadow Book <span class="ver-badge" style="font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(167,139,250,.15);color:var(--accent);border:1px solid rgba(167,139,250,.35);font-family:var(--mono)">v6</span> <span class="suite-badge" id="suiteBadge" title="Versiune suită PWA">—</span></h1>
  <button class="nav-link" id="btnEval">📊 Evaluează pending</button>
  <a class="nav-link" href="../">← Hub</a>
</header>

<div class="panel">
  <h2 style="font-size:13px;margin-bottom:8px">📥 Import JSON Pine (blocked/shadow)</h2>
  <textarea id="pasteJson" placeholder='{"deck":"ZL_DISTREV","event":"ZL_DISTREV_BLOCKED","symbol":"BTCUSDT","side":"LONG","blocked":true,"blockedBy":"Q_REV","price":"64000","src":"distrev"}'></textarea>
  <p class="note">Acceptă și payload DistRev (`ZL_DISTREV_*`, deck ZL_DISTREV) — blocked + REV/PB/WARN → ledger shadow (I-259).</p>
  <button class="btn" id="btnPaste">Import linii JSON</button>
</div>

<div id="cdShadowGate" style="margin-bottom:12px"></div>

<div class="panel">
  <h2 style="font-size:13px;margin-bottom:8px">➕ Manual</h2>
  <div class="frm">
    <label>Ticker <input id="fSym"></label>
    <label>Preț <input id="fPx" type="number" step="0.01"></label>
    <label>SL <input id="fSl" type="number" step="0.01"></label>
    <label>Filtru <select id="fBlk"><option value="macro-gate">macro-gate</option><option value="minQual">minQual</option><option value="Q_REV">Q_REV (DistRev)</option><option value="HTF">HTF</option><option value="LATE">LATE</option><option value="earnings">earnings</option><option value="whipsaw">whipsaw</option></select></label>
    <label>Sursă <select id="fSrc"><option value="distrev">DistRev</option><option value="zlhma">ZLHMA</option><option value="zlema">ZLEMA</option><option value="amd">AMD</option></select></label>
    <label>Motiv <input id="fWhy"></label>
  </div>
  <button class="btn" id="btnLog">Log shadow</button>
</div>

<div class="panel"><h2 style="font-size:13px;margin-bottom:8px">📈 Atribuire shadow vs realizat (30z)</h2><div id="shadowAttr"></div></div>
<div class="panel"><h2 style="font-size:13px;margin-bottom:8px">Verdict filtre (ipoteze OOS)</h2><div id="edgeTbl"></div></div>
<div class="panel"><h2 style="font-size:13px;margin-bottom:8px">Ultimele intrări</h2><div id="tbl"></div></div>

<script src="../lib/capital-time.js?v=630"></script>
<script src="../lib/account.js?v=575"></script>
<script src="../lib/ledger.js"></script>
<script src="../lib/journal.js?v=7"></script>
<script src="../lib/governor.js?v=630"></script>
<script src="../lib/data.js?v=790"></script>
<script src="../lib/shadow.js?v=3"></script>
<script src="../lib/equity.js?v=7"></script>
<script src="../lib/capital-desk.js?v=6"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderShadowAttr(){
  if (!window.EQ || !EQ.shadowAttribution) { $('shadowAttr').innerHTML = '<p class="note">Equity.js nu e încărcat.</p>'; return; }
  const sh = EQ.shadowAttribution(30);
  $('shadowAttr').innerHTML = sh.n
    ? '<p class="note">Journal 30z: <span class="' + (sh.journalPnl >= 0 ? 'useful' : 'costly') + '">' + (sh.journalPnl >= 0 ? '+' : '') + '$' + sh.journalPnl.toFixed(0) + '</span> · shadow eval n=' + sh.n + '</p>' +
      Object.entries(sh.filters).map(([f, v]) => '<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;padding:4px 0;border-bottom:1px solid rgba(42,50,71,.4)"><span>' + esc(f) + '</span><span>' + v.toFixed(1) + ' R·est</span></div>').join('') +
      '<p class="note">Estimări pe close forward — nu garanție de edge.</p>'
    : '<p class="note">Fără shadow evaluat — loghează semnale blocate și apasă „Evaluează pending".</p>';
}
function renderCdGate(){
  const el = $('cdShadowGate');
  if (!el || !window.CD) return;
  CD.renderRail('capitalRail', 'shadow');
  const b = CD.unified();
  const est = b.account > 0 ? b.account * 0.01 : 100;
  const gate = CD.canAddRisk(est);
  el.innerHTML = CD.gateBannerHtml(gate) + '<p class="note">Semnalele shadow = „ce-ar fi fost" dacă nu erau blocate — compară cu Capital Desk înainte de a ignora un filtru.</p>';
}
function render(){
  renderCdGate();
  renderShadowAttr();
  const edge = SH.filterEdge();
  $('edgeTbl').innerHTML = edge.length ? '<table><tr><th class="l">Filtru</th><th>n</th><th>avg%</th><th>vs base</th><th>verdict</th></tr>' +
    edge.map(e => '<tr><td class="l">' + esc(e.filter) + (e.small?' ⚠':'') + '</td><td>' + e.n + '</td><td>' + (e.avgPct!=null?e.avgPct.toFixed(2)+'%':'—') + '</td><td>' + (e.vsBaseline!=null?(e.vsBaseline>=0?'+':'')+e.vsBaseline.toFixed(2)+'%':'—') + '</td><td class="' + (e.verdict.includes('util')?'useful':'costly') + '">' + esc(e.verdict) + '</td></tr>').join('') + '</table><p class="note">Ipoteze pe close forward — nu garanție de edge.</p>' : '<p class="note">Loghează semnale blocate, apoi evaluează.</p>';
  const rows = SH.all().slice(0, 40);
  $('tbl').innerHTML = rows.length ? '<table><tr><th class="l">Zi</th><th>Sym</th><th>Filtru</th><th>eval%</th><th>R</th></tr>' +
    rows.map(e => '<tr><td class="l">' + esc(e.day) + '</td><td>' + esc(e.sym) + '</td><td>' + esc(e.blockedBy) + '</td><td>' + (e.evalPct!=null?e.evalPct.toFixed(2)+'%':'—') + '</td><td>' + (e.evalR!=null?e.evalR.toFixed(2):'—') + '</td></tr>').join('') + '</table>' : '<p class="note">Gol.</p>';
}
$('btnLog').onclick = () => { SH.log({ sym:$('fSym').value, price:$('fPx').value, sl:$('fSl').value||null, blockedBy:$('fBlk').value, src:$('fSrc').value, reason:$('fWhy').value }); render(); };
$('btnPaste').onclick = () => { const n = SH.ingestText($('pasteJson').value); alert(n + ' intrări importate'); $('pasteJson').value=''; render(); };
$('btnEval').onclick = async () => {
  $('btnEval').disabled = true;
  const n = await SH.evaluateAll((sym, opts) => D.fetchStock(sym, opts), (d,t) => { $('btnEval').textContent = d+'/'+t; });
  $('btnEval').disabled = false; $('btnEval').textContent = '📊 Evaluează pending';
  render();
};
render();
})();
</script>
<script src="../lib/suite-version.js?v=790"></script>

</body>
</html>
