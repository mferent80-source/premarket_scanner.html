<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Tools · Construiește planul · Demo fictiv</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090f15;color:#edf3f4;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #26323d;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:4px 0}p{margin:4px 0;color:#adb9c4;font-size:13px}.eyebrow{color:#70d9aa;font-size:11px;letter-spacing:.15em}nav{display:flex;gap:8px}button{padding:10px 14px;border:1px solid #3b4b59;background:#17222d;color:#edf3f4;cursor:pointer;border-radius:7px;min-height:44px}button[aria-pressed=true]{background:#c3ead9;color:#0d2018}main{padding:16px;display:grid;justify-items:center}iframe{width:100%;height:calc(100dvh - 140px);min-height:700px;border:1px solid #3b4b59;border-radius:12px;background:#0c1016}body.phone iframe{width:360px;max-width:100%;height:780px;border-radius:20px}@media(max-width:480px){header{padding:12px}main{padding:8px}}</style>
<header><div><span class="eyebrow">TEST FUNCȚIONAL · DATE INVENTATE</span><h1>Scanner → Construiește planul</h1><p id="status" role="status">FICTIV-C · fără salvarea scanării · fără ordine sau acces la cont.</p></div><nav aria-label="Test plan"><button id="desktop" aria-pressed="true">Desktop</button><button id="phone" aria-pressed="false">Telefon · 360 px</button><button id="restart">Reia scannerul</button></nav></header>
<main><iframe id="preview" title="Demo fictiv · Scanner și plan" src="../candidate-engine/?demo=1&amp;v=26.10.05.1705"></iframe></main>
<script src="../lib/exchange-calendar.js?v=26.10.09.2330"></script><script src="../lib/daily-series.js?v=26.10.09.2330"></script><script src="../lib/candidate-plan-handoff.js?v=26.10.09.1548"></script>
<script>
(function(){'use strict';var preview=document.getElementById('preview'),pending=null,desktop=document.getElementById('desktop'),phone=document.getElementById('phone');
function mode(value){document.body.classList.toggle('phone',value);desktop.setAttribute('aria-pressed',String(!value));phone.setAttribute('aria-pressed',String(value));}desktop.onclick=function(){mode(false);};phone.onclick=function(){mode(true);};
document.getElementById('restart').onclick=function(){pending=null;preview.src='../candidate-engine/?demo=1&v=26.10.05.1705';document.getElementById('status').textContent='FICTIV-C · fără salvarea scanării · fără ordine sau acces la cont.';};
window.addEventListener('message',function(e){if(e.origin!==location.origin||e.source!==preview.contentWindow||!e.data)return;if(e.data.ttPlanReady){if(pending&&e.data.ttPlanReady.symbol===pending.symbol&&e.data.ttPlanReady.mode===pending.mode){preview.contentWindow.postMessage({ttPlanCandidate:pending},location.origin);pending=null;}return;}if(e.data.ttOpenModule!=='desk/')return;var checked=CandidatePlanHandoff.read(e.data.ttPlanCandidate,{symbol:'FICTIV-C',mode:'momentum'});if(!checked.ok)return;pending=checked.candidate;preview.src='../desk/?demo=1&symbol=FICTIV-C&mode=momentum&ticket=1&handoff=1&v=26.10.05.1705';document.getElementById('status').textContent='Analiza FICTIV-C a fost transmisă direct către plan. Scanarea nu a fost salvată.';});

})();
</script></html>
