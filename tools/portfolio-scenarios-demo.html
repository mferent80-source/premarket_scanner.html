<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scenarii portofoliu · exemplu fictiv</title><link rel="stylesheet" href="../holdings/portfolio-scenarios.css?v=26.10.09.2242"><style>:root{--bg:#101820;--text:#e1e8ec;--muted:#aab9c1;--line:#2a3d47;--accent:#6ad6c1;--warn:#edc477}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;line-height:1.55}main{max-width:1040px;margin:28px auto;padding:24px}h1{font-size:27px;margin:10px 0}h2{font-size:22px}.meta{color:var(--muted)}button{background:#142a2d;border:1px solid var(--line);color:var(--text);font:inherit;padding:10px 14px;border-radius:8px;cursor:pointer}.demo-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}summary{cursor:pointer}.good{color:#6ad6c1}.bad{color:#f29b9b}#testResults{white-space:pre-wrap;border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.mobile-frame{width:390px;height:1200px;border:1px solid var(--line)}@media(max-width:600px){main{padding:18px;margin:0}}</style></head><body><main><p class="meta">VERIFICARE IZOLATĂ · v26.10.09.2242</p><h1>Scenarii pentru întregul portofoliu</h1><p>Date inventate: cont 3.000 EUR, dețineri 2.000 EUR și numerar 1.000 EUR. Fără citirea sau modificarea contului utilizatorului.</p><div class="demo-toolbar"><button id="fresh">Date complete · fictive</button><button id="partial">Poziție incompletă · fictivă</button><button id="stale">Date vechi · fictive</button><button id="run">Rulează verificările</button><button id="mobile">Previzualizare telefon</button></div><section id="portfolioScenarios"></section><pre id="testResults" aria-live="polite">Verificări nepornite</pre></main><script src="../lib/portfolio-scenarios.js?v=26.10.09.2242"></script><script src="../holdings/portfolio-scenarios.js?v=26.10.09.2242"></script><script>
const P=PortfolioScenarios,U=PortfolioScenariosUI;let x=P.demo();const show=()=>U.render({...x,positions:x.snapshot.positions});show();
document.getElementById('fresh').onclick=()=>{x=P.demo();show();};document.getElementById('partial').onclick=()=>{x=P.demo();x.snapshot.positions[0].value=null;show();};document.getElementById('stale').onclick=()=>{x=P.demo(Date.now()-600000);show();};
document.getElementById('mobile').onclick=()=>{const frame=document.createElement('iframe');frame.className='mobile-frame';frame.title='Scenarii pe telefon · date fictive';frame.src=location.pathname+'?phone=1';document.querySelector('main').replaceChildren(frame);};
if(new URLSearchParams(location.search).has('phone'))document.getElementById('mobile').hidden=true;
document.getElementById('run').onclick=()=>{const now=Date.now(),checks=[],check=(name,fn)=>{try{fn();checks.push('TRECUT · '+name);}catch(e){checks.push('EȘEC · '+name+' · '+e.message);}},ok=(v,msg)=>{if(!v)throw Error(msg||'Rezultat incorect');},calc=(f,s={pricePct:-10,fxPct:-5,sector:'*',fxCurrency:'*'})=>P.calculate(f.snapshot,f.notes,s,{now});
check('Prețul și FX se compun: schimbare −267,50 EUR',()=>ok(Math.abs(calc(P.demo(now)).knownDelta+267.5)<1e-8));
check('Numerarul rămâne constant: total 2.732,50 EUR',()=>ok(Math.abs(calc(P.demo(now)).projectedTotal-2732.5)<1e-8));
check('Moneda contului nu primește șoc FX',()=>ok(calc(P.demo(now)).rows[1].fxPct===0));
check('Pence păstrate la preț și grupate ca GBP',()=>{const r=calc(P.demo(now)).rows[2];ok(r.quoteCurrency==='GBP'&&r.instrumentCurrency==='GBp'&&r.projectedPrice===4500);});
check('Sectorul și moneda sunt filtre independente',()=>ok(Math.abs(calc(P.demo(now),{pricePct:-10,fxPct:-5,sector:'Industrie',fxCurrency:'USD'}).knownDelta+95)<1e-8));
check('Snapshot vechi blochează totalul',()=>ok(calc(P.demo(now-600000)).projectedTotal===null));
check('Poziție lipsă produce calcul parțial',()=>{const f=P.demo(now);f.snapshot.positions[0].value=null;const r=calc(f);ok(r.state==='partial'&&r.covered===2&&r.projectedTotal===null);});
check('Calculele păstrează datele originale',()=>{const f=P.demo(now),before=JSON.stringify(f);calc(f);ok(JSON.stringify(f)===before);});
const failures=checks.filter(c=>c.startsWith('EȘEC')).length;document.getElementById('testResults').textContent=(checks.length-failures)+' verificări trecute · '+failures+' eșecuri\n'+checks.join('\n');};
</script></body></html>
