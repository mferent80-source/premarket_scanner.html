# Deploy pentru CORS proxy-ul suitei (tools/cf-worker-proxy.js).
#
# Pana pe 22.09.2026 worker-ul se actualiza LIPIND fisierul in dashboard-ul Cloudflare.
# Asta inseamna ca o reparatie comisa aici nu ajungea la el pana cand cineva nu deschidea
# browserul si nu apasa Deploy - si nimic din repo nu spunea daca s-a facut sau nu.
#
#   npx wrangler deploy --config tools/cf-proxy-wrangler.toml --keep-vars
#
# ATENTIE la deploy:
#
#  1. FARA CRON (27.10.2026, audit E / I-755). Dispatch-ul la 5 minute spre workflow-ul
#     „Price Alerts" a fost scos pe 27.09.2026 (manca toata cota lunara de Actions in ~6 zile),
#     dar sectiunea [triggers] a ramas aici pana azi: urmatorul deploy ar fi REPORNIT 288 de
#     rulari/zi. Handler-ul `scheduled` a fost retras din cf-worker-proxy.js. Singurul cron
#     Cloudflare al suitei e monitorul contului, declarat in tools/cloud-sync-wrangler.jsonc.
#     Testul tools/wrangler-cron.test.mjs pazeste amandoua.
#
#  2. VARIABILELE. `--keep-vars` pastreaza ce e setat in dashboard. Secretele
#     (JOURNAL_INGEST_SECRET, JOURNAL_GIST_ID, JOURNAL_GIST_TOKEN) sunt gestionate separat
#     prin `wrangler secret` si nu se pierd la deploy - dar `--keep-vars` ramane
#     obligatoriu cat timp configul de aici nu declara [vars]. GH_DISPATCH_TOKEN nu mai e folosit
#     de nimic si poate fi sters din dashboard.
#
# `compatibility_date` e EXACT cea cu care ruleaza worker-ul acum (citita din API).
# Nu o urca fara motiv: schimba comportamentul runtime-ului sub un cod care merge.

name = "tt-proxy"
main = "cf-worker-proxy.js"
compatibility_date = "2026-06-12"
workers_dev = true

# Worker-ul avea `previews_enabled: false` inainte de primul deploy prin wrangler
# (citit din API). Wrangler le ACTIVEAZA implicit cand `workers.dev` e pornit si
# setarea lipseste din config, ceea ce ar expune URL-uri de preview care pana acum
# nu existau. Declarat explicit ca sa ramana cum era.
preview_urls = false
