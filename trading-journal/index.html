<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 Trading Journal — Pionex Futures + Grid</title>
<style>
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --border:#e2e8f0;
  --t1:#0f172a;
  --t2:#475569;
  --t3:#94a3b8;
  --primary:#0891b2;
  --primary-dark:#0e7490;
  --success:#15803d;
  --success-bg:#dcfce7;
  --success-bd:#86efac;
  --danger:#b91c1c;
  --danger-bg:#fee2e2;
  --danger-bd:#fca5a5;
  --warn:#a16207;
  --warn-bg:#fef3c7;
  --warn-bd:#fde68a;
  --info:#1e40af;
  --info-bg:#dbeafe;
  --info-bd:#93c5fd;
  --futures:#7c3aed;
  --futures-bg:#ede9fe;
  --futures-bd:#c4b5fd;
  --grid:#0e7490;
  --grid-bg:#cffafe;
  --grid-bd:#67e8f9;
  --stock:#0369a1;
  --stock-bg:#e0f2fe;
  --stock-bd:#7dd3fc;
  --r:10px;
  --head:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--head);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;min-height:100vh}
.app{max-width:1400px;margin:0 auto;padding:18px}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;padding:18px 22px;border-radius:var(--r);margin-bottom:16px;box-shadow:0 2px 8px rgba(8,145,178,.2)}
.hdr h1{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em}
.hdr .sub{opacity:.85;font-size:.7rem;margin-top:4px}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#fff;padding:4px;border-radius:var(--r);border:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.7rem;font-weight:700;color:var(--t2);white-space:nowrap;transition:all .15s}
.tab:hover{background:#f1f5f9}
.tab.active{background:var(--primary);color:#fff}

/* STATS BAR */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.stat .lbl{font-size:.55rem;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px}
.stat .val{font-size:1.1rem;font-weight:800;color:var(--t1);font-family:'Roboto Mono',ui-monospace,monospace}
.stat.pos .val{color:var(--success)}
.stat.neg .val{color:var(--danger)}
.stat .sub{font-size:.55rem;color:var(--t3);margin-top:2px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.card-t{font-weight:700;font-size:.85rem}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--t1);font-size:.65rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:var(--head)}
.btn:hover{background:#f1f5f9}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.success{background:var(--success);color:#fff;border-color:var(--success)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:.55rem}

/* FORMS */
.form-row{display:grid;gap:8px;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:.55rem;color:var(--t3);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.field input, .field select, .field textarea{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:.7rem;font-family:var(--head);color:var(--t1);background:#fff}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.1)}
.field textarea{resize:vertical;min-height:60px}

/* TRADE ROW */
.trade{padding:10px 13px;border-radius:9px;margin-bottom:7px;border:1px solid;background:#fff}
.trade.open{border-color:var(--info-bd);background:linear-gradient(to right,var(--info-bg),#fff)}
.trade.win{border-color:var(--success-bd);background:linear-gradient(to right,var(--success-bg),#fff)}
.trade.loss{border-color:var(--danger-bd);background:linear-gradient(to right,var(--danger-bg),#fff)}
.trade.partial{border-color:var(--warn-bd);background:linear-gradient(to right,var(--warn-bg),#fff)}

.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge.fut{background:var(--futures-bg);color:var(--futures);border:1px solid var(--futures-bd)}
.badge.grid{background:var(--grid-bg);color:var(--grid);border:1px solid var(--grid-bd)}
.badge.stock{background:var(--stock-bg);color:var(--stock);border:1px solid var(--stock-bd)}
.badge.long{background:var(--success-bg);color:var(--success);border:1px solid var(--success-bd)}
.badge.short{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)}
.badge.win{background:var(--success-bg);color:var(--success);border:1px solid var(--success-bd)}
.badge.loss{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)}
.badge.open{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd)}
.badge.partial{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;background:#fff;border:1px solid var(--border);border-radius:6px;padding:4px;font-size:.55rem;display:flex;flex-direction:column;cursor:pointer;transition:transform .1s}
.cal-day:hover{transform:scale(1.05);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cal-day.empty{background:#f8fafc;border:none;cursor:default}
.cal-day.empty:hover{transform:none;box-shadow:none}
.cal-day.win{background:var(--success-bg);border-color:var(--success-bd)}
.cal-day.loss{background:var(--danger-bg);border-color:var(--danger-bd)}
.cal-day.mixed{background:var(--warn-bg);border-color:var(--warn-bd)}
.cal-day .num{font-weight:700;color:var(--t1)}
.cal-day .pnl{font-size:.5rem;color:var(--t2);font-family:'Roboto Mono',monospace;margin-top:auto}
.cal-head{font-size:.55rem;color:var(--t3);font-weight:700;text-align:center;padding:5px;text-transform:uppercase}

/* EQUITY CHART */
.equity{height:280px;position:relative}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-h{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-h h2{font-size:.95rem;font-weight:800}
.modal-c{padding:18px 20px}
.close-x{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--t3);line-height:1}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--t3)}
.empty-icon{font-size:3rem;margin-bottom:8px;opacity:.5}
.empty-title{font-size:1rem;font-weight:700;color:var(--t2);margin-bottom:5px}
.empty-sub{font-size:.7rem}

/* AI ANALYSIS */
.ai-result{background:linear-gradient(135deg,#fef3c7,#fef9c3);border:1px solid var(--warn-bd);border-radius:10px;padding:13px 15px;font-size:.7rem;line-height:1.6;color:#78350f;margin-top:10px}
.ai-result strong{color:#92400e}
.ai-loading{padding:14px;text-align:center;color:var(--t2);font-size:.65rem}

/* SCREENSHOTS */
.screenshot{background:#f1f5f9;border:1px dashed var(--border);border-radius:8px;padding:12px;margin-top:8px;text-align:center}
.screenshot img{max-width:100%;max-height:250px;border-radius:6px;border:1px solid var(--border)}
.screenshot.empty{padding:20px;color:var(--t3);font-size:.6rem}

@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-row.cols-2, .form-row.cols-3{grid-template-columns:1fr !important}
}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
</style>
</head>
<body>

<div class="app">
  <div class="hdr" style="position:relative;">
    <a href="../" style="position:absolute;top:14px;right:18px;padding:5px 12px;border-radius:7px;font-size:.62rem;font-weight:700;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .15s;" onmouseover="this.style.background='rgba(255,255,255,.28)'" onmouseout="this.style.background='rgba(255,255,255,.15)'">← Hub</a>
    <h1>📓 Trading Journal — Pionex + Trade 212</h1>
    <div class="sub" id="hdrSub">v1.2 · Crypto futures + grid + Nasdaq stocks · Local storage · Stats · Calendar · Equity</div>
  </div>

  <!-- STATS -->
  <div class="stats" id="statsBar"></div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="setTab('all',this)">📊 Toate Trade-urile</div>
    <div class="tab" onclick="setTab('add',this)">➕ Add Trade</div>
    <div class="tab" onclick="setTab('calendar',this)">📅 Calendar</div>
    <div class="tab" onclick="setTab('equity',this)">📈 Equity Curve</div>
    <div class="tab" onclick="setTab('settings',this)">⚙️ Setări</div>
  </div>

  <div id="content"></div>
</div>

<!-- MODAL: Trade Detail -->
<div class="modal-bg" id="tradeModal">
  <div class="modal">
    <div class="modal-h">
      <h2 id="tradeModalTitle">Trade Detail</h2>
      <button class="close-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-c" id="tradeModalContent"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let trades = [];
let settings = { aiKey: '', accountSize: 1000 };
let currentTab = 'all';
let currentMonth = new Date();
let filters = { coin: '', type: 'all', status: 'all', period: 'all' };

// Load from localStorage
try {
  trades = JSON.parse(localStorage.getItem('journal_trades') || '[]');
  settings = { ...settings, ...JSON.parse(localStorage.getItem('journal_settings') || '{}') };
} catch(e) {}

function saveTrades() {
  try { localStorage.setItem('journal_trades', JSON.stringify(trades)); } catch(e) {}
}
function saveSettings() {
  try { localStorage.setItem('journal_settings', JSON.stringify(settings)); } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function fmtUSD(v) {
  const n = Number(v) || 0;
  const sign = n >= 0 ? '+' : '';
  return sign + '$' + n.toFixed(2);
}
function fmtPct(v) {
  const n = Number(v) || 0;
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(2) + '%';
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('ro-RO', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
}
function newId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// ═══════════════════════════════════════════════════════
// STATS CALCULATION
// ═══════════════════════════════════════════════════════
function computeStats() {
  const closed = trades.filter(t => t.status === 'win' || t.status === 'loss');
  const open = trades.filter(t => t.status === 'open');
  
  const totalPnL = closed.reduce((s, t) => s + (Number(t.pnl) || 0), 0);
  const wins = closed.filter(t => t.status === 'win');
  const losses = closed.filter(t => t.status === 'loss');
  const winRate = closed.length ? (wins.length / closed.length * 100) : 0;
  
  const avgWin = wins.length ? wins.reduce((s,t)=>s+(Number(t.pnl)||0),0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s,t)=>s+(Number(t.pnl)||0),0)/losses.length : 0;
  const avgRR = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : 0;
  
  // Profit factor
  const grossWin = wins.reduce((s,t)=>s+(Number(t.pnl)||0),0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+(Number(t.pnl)||0),0));
  const profitFactor = grossLoss > 0 ? grossWin / grossLoss : 0;
  
  return { closed: closed.length, open: open.length, totalPnL, winRate, avgWin, avgLoss, avgRR, profitFactor, wins: wins.length, losses: losses.length };
}

function renderStats() {
  const s = computeStats();
  const c = document.getElementById('statsBar');
  c.innerHTML = `
    <div class="stat ${s.totalPnL >= 0 ? 'pos' : 'neg'}">
      <div class="lbl">P&L Total</div>
      <div class="val">${fmtUSD(s.totalPnL)}</div>
      <div class="sub">${s.closed} trade-uri închise</div>
    </div>
    <div class="stat">
      <div class="lbl">Win Rate</div>
      <div class="val">${s.winRate.toFixed(1)}%</div>
      <div class="sub">${s.wins}W / ${s.losses}L</div>
    </div>
    <div class="stat">
      <div class="lbl">Avg R:R</div>
      <div class="val">${s.avgRR.toFixed(2)}</div>
      <div class="sub">Win/Loss raport</div>
    </div>
    <div class="stat">
      <div class="lbl">Profit Factor</div>
      <div class="val">${s.profitFactor.toFixed(2)}</div>
      <div class="sub">>1.5 = profitabil</div>
    </div>
    <div class="stat">
      <div class="lbl">Open Trades</div>
      <div class="val">${s.open}</div>
      <div class="sub">trade-uri active</div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════
function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  render();
}

function render() {
  renderStats();
  renderStaleAlert();
  const c = document.getElementById('content');
  if (currentTab === 'all') c.innerHTML = renderAllTrades();
  else if (currentTab === 'add') c.innerHTML = renderAddForm();
  else if (currentTab === 'calendar') c.innerHTML = renderCalendar();
  else if (currentTab === 'equity') c.innerHTML = renderEquity();
  else if (currentTab === 'settings') c.innerHTML = renderSettings();
  
  if (currentTab === 'equity') setTimeout(drawEquityChart, 50);
}

function renderStaleAlert() {
  const now = Date.now();
  const stale = trades.filter(t => t.status === 'open' && t.openTime && (now - t.openTime) > 24*60*60*1000);
  
  let alertEl = document.getElementById('staleAlert');
  if (!alertEl) {
    alertEl = document.createElement('div');
    alertEl.id = 'staleAlert';
    document.querySelector('.tabs').insertAdjacentElement('beforebegin', alertEl);
  }
  
  if (!stale.length) {
    alertEl.style.display = 'none';
    return;
  }
  
  const oldestHours = Math.floor((now - Math.min(...stale.map(t => t.openTime))) / 3600000);
  const oldestStr = oldestHours > 48 ? Math.floor(oldestHours/24) + ' zile' : oldestHours + 'h';
  
  alertEl.style.display = 'block';
  alertEl.innerHTML = `
    <div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #f59e0b;border-radius:10px;padding:11px 15px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="font-size:1.2rem">⚠️</div>
      <div style="flex:1;font-size:.7rem;color:#78350f;line-height:1.5">
        <strong>${stale.length} trade${stale.length>1?'-uri':''} deschise de peste 24h</strong>
        <div style="font-size:.6rem;color:#92400e;margin-top:2px">Cel mai vechi: ${oldestStr}. Verifică dacă ai uitat să le închizi: ${stale.slice(0,3).map(t=>t.coin).join(', ')}${stale.length>3?'...':''}</div>
      </div>
      <button class="btn sm" onclick="filters={coin:'',type:'all',status:'open',period:'all'};setTab('all',document.querySelectorAll('.tab')[0])" style="background:#f59e0b;color:#fff;border-color:#f59e0b">Vezi tot</button>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
// ALL TRADES TAB
// ═══════════════════════════════════════════════════════
function renderAllTrades() {
  if (!trades.length) {
    return `<div class="empty">
      <div class="empty-icon">📓</div>
      <div class="empty-title">Niciun trade înregistrat</div>
      <div class="empty-sub">Apasă pe <strong>➕ Add Trade</strong> pentru a începe.</div>
    </div>`;
  }
  
  // Build coin list for filter dropdown
  const allCoins = [...new Set(trades.map(t => t.coin).filter(Boolean))].sort();
  
  // Apply filters
  let filtered = [...trades];
  if (filters.coin) filtered = filtered.filter(t => t.coin === filters.coin);
  if (filters.type !== 'all') filtered = filtered.filter(t => t.type === filters.type);
  if (filters.status !== 'all') filtered = filtered.filter(t => t.status === filters.status);
  if (filters.period !== 'all') {
    const now = Date.now();
    const periodMs = { '7d': 7*86400000, '30d': 30*86400000, '90d': 90*86400000 }[filters.period];
    if (periodMs) filtered = filtered.filter(t => (t.closeTime || t.openTime || 0) >= now - periodMs);
  }
  
  const sorted = filtered.sort((a, b) => (b.openTime || 0) - (a.openTime || 0));
  let html = '';
  
  // Filter bar
  html += '<div class="card" style="padding:10px 13px"><div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:.6rem">';
  html += '<span style="color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.04em">🔍 Filter:</span>';
  
  // Coin filter
  html += '<select onchange="filters.coin=this.value;render()" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:.6rem;font-family:inherit">';
  html += '<option value="">Toate coins</option>';
  allCoins.forEach(c => {
    html += `<option value="${c}" ${filters.coin===c?'selected':''}>${c}</option>`;
  });
  html += '</select>';
  
  // Type filter
  html += '<select onchange="filters.type=this.value;render()" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:.6rem;font-family:inherit">';
  [['all','Toate tipuri'],['futures','Futures'],['grid','Grid Bot'],['stock','Stocks (Nasdaq)']].forEach(([v,l])=>{
    html += `<option value="${v}" ${filters.type===v?'selected':''}>${l}</option>`;
  });
  html += '</select>';
  
  // Status filter
  html += '<select onchange="filters.status=this.value;render()" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:.6rem;font-family:inherit">';
  [['all','Toate'],['open','Open'],['win','Wins'],['loss','Losses'],['partial','Partial']].forEach(([v,l])=>{
    html += `<option value="${v}" ${filters.status===v?'selected':''}>${l}</option>`;
  });
  html += '</select>';
  
  // Period filter
  html += '<select onchange="filters.period=this.value;render()" style="padding:5px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:.6rem;font-family:inherit">';
  [['all','Toate perioade'],['7d','Ultimele 7 zile'],['30d','30 zile'],['90d','90 zile']].forEach(([v,l])=>{
    html += `<option value="${v}" ${filters.period===v?'selected':''}>${l}</option>`;
  });
  html += '</select>';
  
  // Reset button
  if (filters.coin || filters.type !== 'all' || filters.status !== 'all' || filters.period !== 'all') {
    html += `<button class="btn sm" onclick="filters={coin:'',type:'all',status:'all',period:'all'};render()" style="margin-left:auto">✕ Reset</button>`;
  }
  
  html += `<span style="margin-left:auto;color:#94a3b8">${filtered.length} / ${trades.length}</span>`;
  html += '</div></div>';
  
  if (!filtered.length) {
    html += `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Niciun rezultat</div><div class="empty-sub">Schimbă filtrul sau apasă Reset.</div></div>`;
    return html;
  }
  
  // Open trades first
  const open = sorted.filter(t => t.status === 'open');
  const closed = sorted.filter(t => t.status !== 'open');
  
  if (open.length) {
    html += '<div class="card"><div class="card-h"><div class="card-t">📍 Trade-uri Active (' + open.length + ')</div></div>';
    open.forEach(t => html += renderTradeRow(t));
    html += '</div>';
  }
  
  if (closed.length) {
    html += '<div class="card"><div class="card-h"><div class="card-t">📊 Istoric (' + closed.length + ')</div>';
    html += '<button class="btn sm danger" onclick="exportCSV()">📥 Export CSV</button></div>';
    closed.forEach(t => html += renderTradeRow(t));
    html += '</div>';
  }
  
  return html;
}

function renderTradeRow(t) {
  const typeBadge = t.type === 'futures'
    ? '<span class="badge fut">FUTURES</span>'
    : t.type === 'stock'
    ? '<span class="badge stock">STOCK</span>'
    : '<span class="badge grid">GRID</span>';

  let dirBadge = '';
  // Atât pentru futures cât și pentru stocks (Trade 212 permite long și CFD short)
  if (t.type === 'futures' || t.type === 'stock') {
    dirBadge = t.direction === 'long'
      ? '<span class="badge long">LONG</span>'
      : '<span class="badge short">SHORT</span>';
  }

let pendingScreenshot = null;
function loadScreenshot(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingScreenshot = e.target.result;
    document.getElementById('screenshotPreview').innerHTML = 
      `<div class="screenshot"><img src="${pendingScreenshot}"></div>`;
  };
  reader.readAsDataURL(file);
}

function addTrade() {
  const type = document.getElementById('f_type').value;
  const coin = document.getElementById('f_coin').value.trim().toUpperCase();
  if (!coin) { alert('Introdu coin-ul!'); return; }
  
  const status = document.getElementById('f_status').value;
  const entry = parseFloat(document.getElementById('f_entry').value) || null;
  const sl = parseFloat(document.getElementById('f_sl').value) || null;
  const tp = parseFloat(document.getElementById('f_tp').value) || null;
  const exit = parseFloat(document.getElementById('f_exit').value) || null;
  const size = parseFloat(document.getElementById('f_size').value) || null;
  const lev = parseFloat(document.getElementById('f_lev').value) || 1;
  let pnl = parseFloat(document.getElementById('f_pnl').value);
  
  // Auto-calcul PnL dacă entry+exit+size există și pnl e gol
  if ((isNaN(pnl) || pnl === null) && entry && exit && size) {
    const dir = document.getElementById('f_dir').value;
    const priceMove = dir === 'long' ? (exit - entry) / entry : (entry - exit) / entry;
    pnl = priceMove * size * lev;
  }

  let pnlPct = null;
  if (size && !isNaN(pnl)) pnlPct = (pnl / size) * 100;

  const trade = {
    id: newId(),
    type,
    coin,
    // Direction se salvează și pentru stocks (long/short pe Trade 212 CFD)
    direction: (type === 'futures' || type === 'stock') ? document.getElementById('f_dir').value : null,
    status,
    entry, sl, tp, exit, size, leverage: lev,
    pnl: !isNaN(pnl) ? pnl : null,
    pnlPct,
    setup: document.getElementById('f_setup').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    screenshot: pendingScreenshot,
    openTime: Date.now(),
    closeTime: status !== 'open' ? Date.now() : null
  };
  
  trades.push(trade);
  saveTrades();
  pendingScreenshot = null;
  
  // Reset form
  ['f_coin','f_entry','f_sl','f_tp','f_exit','f_size','f_pnl','f_setup','f_notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('screenshotPreview').innerHTML = '';
  document.getElementById('f_screenshot').value = '';
  
  setTab('all', document.querySelectorAll('.tab')[0]);
}

  if (t.closeTime) html += `<div><strong>Închis:</strong> ${fmtDate(t.closeTime)}</div>`;
  if (t.entry) html += `<div><strong>Entry:</strong> ${t.entry}</div>`;
  if (t.sl) html += `<div><strong>SL:</strong> ${t.sl}</div>`;
  if (t.tp) html += `<div><strong>TP:</strong> ${t.tp}</div>`;
  if (t.exit) html += `<div><strong>Exit:</strong> ${t.exit}</div>`;
  if (t.size) html += `<div><strong>Size:</strong> $${t.size}</div>`;
  if (t.leverage > 1) html += `<div><strong>Leverage:</strong> ${t.leverage}x</div>`;
  if (t.pnl !== null && t.pnl !== undefined && t.pnl !== '') html += `<div><strong>P&L:</strong> <span style="color:${Number(t.pnl)>=0?'#15803d':'#b91c1c'};font-weight:800">${fmtUSD(t.pnl)}</span></div>`;
  if (t.setup) html += `<div style="margin-top:8px"><strong>Setup:</strong> ${t.setup}</div>`;
  if (t.notes) html += `<div style="margin-top:8px"><strong>Notițe:</strong><br><em>${t.notes.replace(/\n/g,'<br>')}</em></div>`;
  if (t.screenshot) html += `<div class="screenshot" style="margin-top:10px"><img src="${t.screenshot}"></div>`;
  html += '</div>';
  
  // Action buttons
  html += '<div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap">';
  if (t.status === 'open') {
    html += `<button class="btn success" onclick="closeTrade('${t.id}','win')">✅ Mark Win</button>`;
    html += `<button class="btn danger" onclick="closeTrade('${t.id}','loss')">❌ Mark Loss</button>`;
  }
  if (t.status === 'loss' && settings.aiKey) {
    html += `<button class="btn primary" onclick="analyzeLoss('${t.id}')">🤖 Analiză AI</button>`;
  }
  html += `<button class="btn" onclick="deleteTrade('${t.id}')" style="margin-left:auto;color:#b91c1c">🗑 Șterge</button>`;
  html += '</div>';
  
  // AI result placeholder
  html += '<div id="aiResult"></div>';
  
  document.getElementById('tradeModalContent').innerHTML = html;
  document.getElementById('tradeModal').classList.add('show');
}

function closeModal() {
  document.getElementById('tradeModal').classList.remove('show');
}

function closeTrade(id, outcome) {
  const t = trades.find(x => x.id === id);
  if (!t) return;
  
  const exitStr = prompt('Exit price:', t.exit || t.entry || '');
  if (exitStr === null) return;
  const exit = parseFloat(exitStr);
  if (isNaN(exit)) { alert('Exit price invalid!'); return; }
  
  let pnl = 0;
  if (t.type === 'futures' && t.entry && t.size) {
    const priceMove = t.direction === 'long' ? (exit - t.entry) / t.entry : (t.entry - exit) / t.entry;
    pnl = priceMove * t.size * (t.leverage || 1);
  } else {
    const pnlStr = prompt('P&L în USDT:', '0');
    if (pnlStr === null) return;
    pnl = parseFloat(pnlStr) || 0;
  }
  
  t.exit = exit;
  t.pnl = pnl;
  t.pnlPct = t.size ? (pnl / t.size) * 100 : null;
  t.status = outcome;
  t.closeTime = Date.now();
  
  saveTrades();
  
  // Fix #1: Auto-trigger AI analysis on Loss if API key configured
  if (outcome === 'loss' && settings.aiKey) {
    // Reopen modal to show trade detail + run AI immediately
    closeModal();
    setTimeout(() => {
      openTradeModal(id);
      setTimeout(() => analyzeLoss(id), 200);
    }, 100);
  } else {
    closeModal();
    render();
  }
}

function deleteTrade(id) {
  if (!confirm('Șterg acest trade?')) return;
  trades = trades.filter(t => t.id !== id);
  saveTrades();
  closeModal();
  render();
}

// ═══════════════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════════════
function renderCalendar() {
  const m = currentMonth.getMonth();
  const y = currentMonth.getFullYear();
  const monthName = currentMonth.toLocaleDateString('ro-RO', { month: 'long', year: 'numeric' });
  
  const firstDay = new Date(y, m, 1).getDay() || 7; // Monday=1, Sunday=7
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  
  // Group trades by day
  const dayPnL = {};
  trades.filter(t => t.status === 'win' || t.status === 'loss').forEach(t => {
    if (!t.closeTime) return;
    const d = new Date(t.closeTime);
    if (d.getMonth() !== m || d.getFullYear() !== y) return;
    const day = d.getDate();
    if (!dayPnL[day]) dayPnL[day] = { pnl: 0, count: 0, wins: 0, losses: 0 };
    dayPnL[day].pnl += Number(t.pnl) || 0;
    dayPnL[day].count++;
    if (t.status === 'win') dayPnL[day].wins++;
    else dayPnL[day].losses++;
  });
  
  let html = `
    <div class="card">
      <div class="card-h">
        <div class="card-t">📅 ${monthName.charAt(0).toUpperCase() + monthName.slice(1)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn sm" onclick="changeMonth(-1)">◀ Anterior</button>
          <button class="btn sm" onclick="goToday()">Azi</button>
          <button class="btn sm" onclick="changeMonth(1)">Următorul ▶</button>
        </div>
      </div>
      
      <div class="cal-grid" style="margin-bottom:6px">
        ${['L','Ma','Mi','J','V','S','D'].map(d => `<div class="cal-head">${d}</div>`).join('')}
      </div>
      
      <div class="cal-grid">
  `;
  
  // Empty cells before day 1
  for (let i = 1; i < firstDay; i++) {
    html += '<div class="cal-day empty"></div>';
  }
  
  // Days
  for (let d = 1; d <= daysInMonth; d++) {
    const data = dayPnL[d];
    let cls = '';
    let pnlStr = '';
    if (data) {
      if (data.wins > 0 && data.losses === 0) cls = 'win';
      else if (data.losses > 0 && data.wins === 0) cls = 'loss';
      else cls = 'mixed';
      pnlStr = `<div class="pnl">${fmtUSD(data.pnl)}</div>`;
    }
    html += `<div class="cal-day ${cls}"><div class="num">${d}</div>${pnlStr}</div>`;
  }
  
  html += '</div></div>';
  
  // Monthly summary
  const monthTotal = Object.values(dayPnL).reduce((s, d) => s + d.pnl, 0);
  const monthCount = Object.values(dayPnL).reduce((s, d) => s + d.count, 0);
  const monthWins = Object.values(dayPnL).reduce((s, d) => s + d.wins, 0);
  const monthWR = monthCount ? (monthWins / monthCount * 100) : 0;
  
  html += `
    <div class="card">
      <div class="card-h"><div class="card-t">📊 Sumar Lună</div></div>
      <div class="stats">
        <div class="stat ${monthTotal >= 0 ? 'pos' : 'neg'}">
          <div class="lbl">P&L</div>
          <div class="val">${fmtUSD(monthTotal)}</div>
        </div>
        <div class="stat">
          <div class="lbl">Trade-uri</div>
          <div class="val">${monthCount}</div>
        </div>
        <div class="stat">
          <div class="lbl">Win Rate</div>
          <div class="val">${monthWR.toFixed(1)}%</div>
        </div>
      </div>
    </div>
  `;
  
  return html;
}

function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  render();
}
function goToday() {
  currentMonth = new Date();
  render();
}

      <div style="margin-top:10px;font-size:.6rem;color:#94a3b8;text-align:center">
        Cont start: $${settings.accountSize} · Click pe punct pentru detalii
      </div>
    </div>
  `;
}

function drawEquityChart() {
  const canvas = document.getElementById('equityCanvas');
  if (!canvas) return;
  
  const closed = trades.filter(t => t.status === 'win' || t.status === 'loss').sort((a, b) => (a.closeTime || 0) - (b.closeTime || 0));
  if (!closed.length) return;
  
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  
  const W = rect.width;
  const H = rect.height;
  const pad = { top: 20, bottom: 30, left: 60, right: 20 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;
  
  // Compute equity values
  let eq = settings.accountSize;
  const points = [{ x: 0, y: eq, label: 'Start' }];
  closed.forEach((t, i) => {
    eq += Number(t.pnl) || 0;
    points.push({ x: i + 1, y: eq, label: t.coin, pnl: t.pnl, status: t.status });
  });
  
  const yMin = Math.min(...points.map(p => p.y));
  const yMax = Math.max(...points.map(p => p.y));
  const yRange = yMax - yMin || 100;
  const yPadding = yRange * 0.1;
  const yLow = yMin - yPadding;
  const yHigh = yMax + yPadding;
  
  // Grid lines + Y labels
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#94a3b8';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch * i / 4);
    const val = yHigh - (yHigh - yLow) * i / 4;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
    ctx.fillText('$' + val.toFixed(0), pad.left - 5, y + 3);
  }
  
  // Start line
  const startY = pad.top + ch * (1 - (settings.accountSize - yLow) / (yHigh - yLow));
  ctx.strokeStyle = '#94a3b8';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(pad.left, startY);
  ctx.lineTo(W - pad.right, startY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillText('Start', pad.left - 5, startY + 3);
  
  // Plot equity line
  const xStep = cw / Math.max(points.length - 1, 1);
  ctx.strokeStyle = '#0891b2';
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = pad.left + i * xStep;
    const y = pad.top + ch * (1 - (p.y - yLow) / (yHigh - yLow));
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Plot points
  points.forEach((p, i) => {
    const x = pad.left + i * xStep;
    const y = pad.top + ch * (1 - (p.y - yLow) / (yHigh - yLow));
    ctx.fillStyle = i === 0 ? '#94a3b8' : (p.status === 'win' ? '#15803d' : '#b91c1c');
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, 2 * Math.PI);
    ctx.fill();
  });
  
  // Final equity label
  const last = points[points.length - 1];
  const lastX = pad.left + (points.length - 1) * xStep;
  const lastY = pad.top + ch * (1 - (last.y - yLow) / (yHigh - yLow));
  ctx.fillStyle = '#0891b2';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('$' + last.y.toFixed(0), lastX + 6, lastY + 3);
  
  // Total P&L
  const totalPnL = last.y - settings.accountSize;
  const totalPnLPct = (totalPnL / settings.accountSize) * 100;
  ctx.fillStyle = totalPnL >= 0 ? '#15803d' : '#b91c1c';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText((totalPnL >= 0 ? '+' : '') + '$' + totalPnL.toFixed(0) + ' (' + (totalPnL >= 0 ? '+' : '') + totalPnLPct.toFixed(1) + '%)', W - pad.right, pad.top + 13);
}

function renderSettings() {
  return `
    <div class="card">
      <div class="card-h"><div class="card-t">⚙️ Setări</div></div>
      
      <div class="form-row">
        <div class="field">
          <label>💼 Cont start (USDT) — pentru equity curve</label>
          <input type="number" id="s_acc" value="${settings.accountSize}" min="10" step="100" onchange="updateSettings()">
        </div>
      </div>
      
      <div class="form-row">
        <div class="field">
          <label>🤖 Anthropic API Key (pentru AI analysis pe trade-uri pierdute)</label>
          <input type="password" id="s_aiKey" value="${settings.aiKey}" placeholder="sk-ant-..." onchange="updateSettings()">
          <div style="font-size:.55rem;color:#94a3b8;margin-top:3px">
            Cheia se salvează DOAR local (browser-ul tău). Nu trimisă nicăieri în afară de Anthropic API.
          </div>
        </div>
      </div>
      
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn primary" onclick="updateSettings();alert('Salvat!')">💾 Salvează</button>
        <button class="btn" onclick="exportData()">📥 Export JSON Backup</button>
        <button class="btn" onclick="importData()">📤 Import JSON</button>
        <button class="btn danger" onclick="clearAll()" style="margin-left:auto">🗑 Șterge Tot</button>
      </div>
    </div>
    
    <div class="card" style="background:#dbeafe;border-color:#93c5fd">
      <div class="card-h"><div class="card-t">📖 Ghid Utilizare</div></div>
      <div style="font-size:.65rem;line-height:1.7;color:#1e3a8a">
        <strong>Workflow zilnic recomandat:</strong><br>
        1. <strong>Înainte de trade</strong>: scanezi pe scanner-ul tău → găsești setup → notezi în jurnal status="open"<br>
        2. <strong>În timpul</strong>: dacă faci modificări (mut SL, partial TP), updezi notele<br>
        3. <strong>După trade</strong>: marchezi Win/Loss → exit price → notițe ce ai învățat<br>
        4. <strong>Săptămânal</strong>: review calendar — există zile cu mai multe pierderi consecutive? Pattern de overtrading?<br>
        5. <strong>Lunar</strong>: la fiecare loss apesi 🤖 Analiză AI — îți vede pattern-uri pe care nu le vezi tu<br><br>
        
        <strong>Câmpurile cele mai valoroase:</strong><br>
        • <strong>Setup</strong>: ce te-a făcut să intri (ex: "Smart Trade L score 82, MTF 3/3")<br>
        • <strong>Notițe</strong>: ce ai SIMȚIT (frică, FOMO, încredere?). Aici e aurul.<br>
        • <strong>Screenshot</strong>: contextul vizual la entry/exit pentru reviu ulterior
      </div>
    </div>
  `;
}

function updateSettings() {
  const acc = parseFloat(document.getElementById('s_acc')?.value);
  const key = document.getElementById('s_aiKey')?.value;
  if (!isNaN(acc)) settings.accountSize = acc;
  if (key !== undefined) settings.aiKey = key;
  saveSettings();
}

function exportData() {
  const data = { trades, settings, exported: new Date().toISOString() };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trading-journal-backup-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.trades) trades = data.trades;
        if (data.settings) settings = { ...settings, ...data.settings };
        saveTrades();
        saveSettings();
        alert('Import reușit! ' + trades.length + ' trade-uri.');
        render();
      } catch (e) {
        alert('Eroare la import: ' + e.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAll() {
  if (!confirm('ȘTERG TOT? Toate trade-urile și setările vor fi pierdute permanent.')) return;
  if (!confirm('Sigur? Asta nu se poate anula!')) return;
  trades = [];
  saveTrades();
  render();
}

function exportCSV() {
  const closed = trades.filter(t => t.status === 'win' || t.status === 'loss');
  if (!closed.length) { alert('Niciun trade închis de exportat.'); return; }
  
  const headers = ['Data', 'Tip', 'Coin', 'Direcție', 'Status', 'Entry', 'SL', 'TP', 'Exit', 'Size $', 'Lev', 'P&L $', 'P&L %', 'Setup', 'Notițe'];
  const rows = closed.map(t => [
    t.closeTime ? new Date(t.closeTime).toISOString().split('T')[0] : '',
    t.type, t.coin, t.direction || '', t.status,
    t.entry || '', t.sl || '', t.tp || '', t.exit || '',
    t.size || '', t.leverage || '', t.pnl || '',
    t.pnlPct?.toFixed(2) || '',
    (t.setup || '').replace(/,/g, ';').replace(/\n/g, ' '),
    (t.notes || '').replace(/,/g, ';').replace(/\n/g, ' ')
  ]);
  
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trading-journal-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}
