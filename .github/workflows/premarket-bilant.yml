name: Top Long — bilanțul probei (săptămânal)

# 19.10.2026 — I-717: sâmbăta, un mesaj pe Discord cu proba Top Long („N/8 · media SUS − JOS · nimic de hotărât încă”) și alarma
# de abatere scrisă înainte (docs/premarket-proba-protocol.md, Anexa A). Citește evaluarea scrisă zilnic de robotul probei; trimite
# DOAR când s-a închis o perioadă nouă. Același grup de concurență ca robotul zilnic (nu se împing două commituri odată).
on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * 6'   # UTC, sâmbăta

permissions:
  contents: write

jobs:
  bilant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: trading-tools-v1-proba
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tools/premarket-bilant.test.mjs
      - name: Bilanțul probei Top Long
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node tools/premarket-bilant.mjs
      - name: Salvează ce s-a trimis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 28.10.2026 (revizia F4): prin unealtă (o eroare reală a lui git nu mai e ascunsă de `|| true`) și push cu 3 încercări, ca la celelalte probe
          node tools/git-add-existente.mjs scanner-verdicts/generated/premarket-bilant.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(premarket): bilantul saptamanal trimis [skip ci]'
            ok=0; for i in 1 2 3; do if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
            [ "$ok" = 1 ] || { echo 'Push eșuat de 3 ori.'; exit 1; }
          fi
      # 27.10.2026 (audit): robotul nu mai cade tăcut — Discord la eșec, ca ceilalți roboți
      - name: Discord la eșec
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          node -e "fetch(process.env.DISCORD_WEBHOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:'**Bilanțul săptămânal al probei Top Long a PICAT** · '+process.env.RUN_URL})}).then(r=>console.log('Discord',r.status)).catch(e=>console.log('Discord',e.message))"
