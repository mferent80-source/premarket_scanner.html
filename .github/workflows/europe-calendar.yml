name: Europe earnings calendar
on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: europe-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_europe_calendar.py'
      - run: python tools/europe-calendar.py
      - name: Publish calendar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe-stocks/calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(europe): refresh public earnings calendar [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      # 20.10.2026 (I-733): robotul nu mai cade tăcut — Discord la eșec, ca ceilalți roboți
      - name: Discord la eșec
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          node -e "fetch(process.env.DISCORD_WEBHOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:'**Robotul calendarului Europa a PICAT** · '+process.argv[1]+'\nAcțiuni Europa rămâne pe ultimul calendar publicat.'})}).then(r=>console.log('Discord: '+r.status)).catch(e=>console.log('Discord: '+e.message))" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
