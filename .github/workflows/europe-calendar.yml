name: Europe earnings calendar
on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: europe-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_europe_calendar.py'
      - run: python tools/europe-calendar.py
      - name: Publish calendar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe-stocks/calendar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(europe): refresh public earnings calendar"
          git pull --rebase origin main
          git push origin HEAD:main
