# ═══════════════════════════════════════════════════════════════════
# Price Alerts → Telegram (server-side, fără pagină deschisă)
# Rulează tools/check-alerts.mjs la 15 min, NON-STOP (toate zilele, toate orele) —
# crypto (USDT/-USD) se tranzacționează 24/7, deci trebuie verificat și noaptea/weekend.
# Stocks în afara orelor de piață: Yahoo dă ultima cotație (staționară) → nu produc
# alerte noi false (pragul ar fi declanșat deja în sesiune), deci e safe să rulăm mereu.
# ⚠ GitHub NU garantează cadența pe cron programat — sub încărcare poate sări/întârzia.
#   */15 ≈ 1/3 din costul metered față de */5 (buget Actions; iul 2026 ~$31 pe premarket).
# Necesită secrets: TELEGRAM_TOKEN + TELEGRAM_CHAT_ID
#   (+ FINNHUB_API_KEY pentru News Watch — opțional; fără el skip pe news)
#   (repo → Settings → Secrets and variables → Actions → New repository secret)
# Test manual: tab-ul Actions → Price Alerts → Run workflow.
# ═══════════════════════════════════════════════════════════════════
name: Price Alerts → Telegram

# 27.09.2026 (alerts v116): pragurile au fost scoase din pagina alerts, deci pasul lor a disparut de aici.
# Cronul ramane pentru News Watch (alertele de stiri cu laptopul inchis).
on:
  schedule:
    # 27.09.2026: la ORA, nu la 30 min - pe depozit privat fiecare rulare e un minut facturat; cronul de 5 min
    # de pe worker-ul tt-proxy (dispatch) a fost sters in aceeasi zi: el manca toata cota lunara in ~6 zile.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # comite starea înapoi (one-shot consumate / re-arm)

concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verifică News Watch
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node tools/check-news-watch.mjs

      - name: Persistă starea (price + news + digest)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          CHANGED=0
          if ! git diff --quiet tools/alerts.json; then git add tools/alerts.json; CHANGED=1; fi
          if ! git diff --quiet tools/hub-stale-digest.json; then git add tools/hub-stale-digest.json; CHANGED=1; fi
          if ! git diff --quiet tools/news-watch.json; then git add tools/news-watch.json; CHANGED=1; fi
          if ! git diff --quiet tools/news-audit.jsonl 2>/dev/null; then
            if [ -f tools/news-audit.jsonl ]; then git add tools/news-audit.jsonl; CHANGED=1; fi
          fi
          if [ "$CHANGED" = "1" ]; then
            git commit -m 'chore(alerts): stare actualizata dupa verificare [skip ci]'
            # push-ul cadea cand remote-ul se misca intre checkout si push (alta
            # rulare, sau un commit facut de mana): "! [rejected] main -> main
            # (fetch first)". Reincercam cu rebase, de 3 ori, cu pauza scurta.
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push respins (incercarea $i) - fac rebase si reincerc"
              git pull --rebase --autostash origin main || break
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::Nu am putut salva starea alertelor dupa 3 incercari."
              exit 0
            fi
          fi
