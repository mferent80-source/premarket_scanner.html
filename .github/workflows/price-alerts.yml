# ═══════════════════════════════════════════════════════════════════
# News Watch → Discord (server-side, fără pagină deschisă) — Telegram închis 11.10.2026
# 27.10.2026 (audit E, I-756): singurul pas e tools/check-news-watch.mjs (știri + calendarul de rezultate,
# pe lista din tools/alerts.json, starea în tools/news-watch.json). Pragurile de preț NU mai există aici:
# mișcarea, insiderii și rezultatele vin din poza Radarului (v116, 27.09.2026); botul vechi tools/check-alerts.mjs
# a fost retras. Pipeline-ul întreg: docs/automation.md.
# ⚠ GitHub NU garantează cadența pe cron programat — sub încărcare poate sări/întârzia.
# Necesită secrets: DISCORD_WEBHOOK (canalul Crypto Radar) + FINNHUB_API_KEY (fără el robotul iese fără să facă nimic)
#   (repo → Settings → Secrets and variables → Actions → New repository secret)
# Test manual: tab-ul Actions → News Watch → Run workflow.
# ═══════════════════════════════════════════════════════════════════
name: News Watch → Discord

# 27.09.2026 (alerts v116): pragurile au fost scoase din pagina alerts, deci pasul lor a disparut de aici.
# Cronul ramane pentru News Watch (alertele de stiri cu laptopul inchis).
on:
  schedule:
    # 27.09.2026: la ORA, nu la 30 min - pe depozit privat fiecare rulare e un minut facturat; cronul de 5 min
    # de pe worker-ul tt-proxy (dispatch) a fost sters in aceeasi zi: el manca toata cota lunara in ~6 zile.
    # 13.10.2026 (curățenia GitHub): la 2 ore - fiecare stare salvată e un commit care republică site-ul; Radarul de acasă le dă pe loc cât PC-ul e pornit
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # comite starea înapoi (one-shot consumate / re-arm)

concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 27.10.2026 (audit E Y7): fără termen, un Finnhub care atârnă ținea rularea ore întregi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verifică News Watch
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node tools/check-news-watch.mjs

      - name: Persistă starea (news + audit)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CHANGED=0
          if ! git diff --quiet tools/news-watch.json; then git add tools/news-watch.json; CHANGED=1; fi
          if ! git diff --quiet tools/news-audit.jsonl 2>/dev/null; then
            if [ -f tools/news-audit.jsonl ]; then git add tools/news-audit.jsonl; CHANGED=1; fi
          fi
          if [ "$CHANGED" = "1" ]; then
            git commit -m 'chore(alerts): stare actualizata dupa verificare [skip ci]'
            # push-ul cadea cand remote-ul se misca intre checkout si push (alta
            # rulare, sau un commit facut de mana): "! [rejected] main -> main
            # (fetch first)". Reincercam cu rebase, de 3 ori, cu pauza scurta.
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push respins (incercarea $i) - fac rebase si reincerc"
              git pull --rebase --autostash origin main || break
              sleep 3
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::Nu am putut salva starea alertelor dupa 3 incercari (starea «seen» se pierde ⇒ alertele se retrimit)."
              exit 1
            fi
          fi

      # 27.10.2026 (audit E Y7): singurul robot zilnic fără alarmă — acum, ca la ceilalți, un rând pe Discord când pică
      - name: Discord la eșec
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          node -e "fetch(process.env.DISCORD_WEBHOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:'**Robotul de știri (News Watch) a PICAT** · '+process.env.RUN_URL+'\nStarea «seen» nu s-a salvat: următoarea rulare poate retrimite aceleași știri.'})}).then(r=>console.log('Discord',r.status)).catch(e=>console.log('Discord',e.message))"
