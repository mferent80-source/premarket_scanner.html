# ═══════════════════════════════════════════════════════════════════
# Price Alerts → Telegram (server-side, fără pagină deschisă)
# Rulează tools/check-alerts.mjs la 5 min, NON-STOP (toate zilele, toate orele) —
# crypto (USDT/-USD) se tranzacționează 24/7, deci trebuie verificat și noaptea/weekend.
# Stocks în afara orelor de piață: Yahoo dă ultima cotație (staționară) → nu produc
# alerte noi false (pragul ar fi declanșat deja în sesiune), deci e safe să rulăm mereu.
# ⚠ GitHub NU garantează cadența pe cron programat — sub încărcare poate sări/întârzia
#   (observat empiric ~1 rulare/1-2h chiar și cu */15). */5 = "cât de des poate", nu fix 5min.
# Necesită secrets: TELEGRAM_TOKEN + TELEGRAM_CHAT_ID
#   (repo → Settings → Secrets and variables → Actions → New repository secret)
# Test manual: tab-ul Actions → Price Alerts → Run workflow.
# ═══════════════════════════════════════════════════════════════════
name: Price Alerts → Telegram

on:
  schedule:
    # la 5 min, 24/7 — crypto e non-stop; stocks acoperite automat în orele lor
    # (cron-ul GitHub e mereu pe UTC, independent de DST)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # comite starea înapoi (one-shot consumate / re-arm)

concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verifică alertele
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node tools/check-alerts.mjs

      - name: Persistă starea (one-shot consumate / re-arm dezarmate)
        run: |
          if ! git diff --quiet tools/alerts.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add tools/alerts.json
            git commit -m 'chore(alerts): stare actualizata dupa verificare [skip ci]'
            git push
          fi
