name: Verdictul pieței (noaptea, pentru Astăzi)

# I-676 / I-677 / I-681 (17.10.2026): același calcul ca pagina Astăzi (lib/market-verdict.js + lib/macro-regime.js), notat noaptea:
# verdictul zilei, istoricul (doar crește), marile companii din calendarul Nasdaq, proba verdictului. Rulează după robotul
# Market Breadth (00:30 UTC), ca să citească raportul lui proaspăt; a doua încercare dimineața.
on:
  workflow_dispatch:
  schedule:
    - cron: '55 0 * * 2-6'
    - cron: '25 5 * * 2-6'

permissions:
  contents: write

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trading-tools-verdict-piata
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # 27.10.2026 (revizia F, 🔴4): și testul permutării pe episoade (mărimea sub GARCH)
      - run: node --test tools/market-verdict.test.mjs tools/macro-regime.test.mjs tools/verdict-piata-robot.test.mjs tools/verdict-piata-permutare.test.mjs tools/verdict-piata-amprenta.test.mjs
      - name: Verdictul zilei
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # doar la schimbarea etichetei (Prudent → Defensiv etc.)
        run: node tools/verdict-piata-robot.mjs
      - name: Garda (istoricul doar crește)
        run: node --test tools/verdict-piata-robot.test.mjs
      - name: Salvează
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-engine/generated/verdict-piata.json candidate-engine/generated/verdict-piata-istoric.jsonl
          # 28.10.2026 (revizia F2, 🟡1 / 🟡4): cursul BNR și zilele / judecata înghețate, câte un fișier (lipsa unuia nu-l mai pierde pe celălalt)
          node tools/git-add-existente.mjs candidate-engine/generated/curs-bnr.json candidate-engine/generated/verdict-piata-inghetat.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'data(verdict): verdictul pieței de noapte [skip ci]'
            ok=0; for i in 1 2 3; do if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
            [ "$ok" = 1 ] || { echo 'Push eșuat de 3 ori.'; exit 1; }
          fi
