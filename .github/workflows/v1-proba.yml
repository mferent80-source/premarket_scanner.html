name: Reguli V1 — proba în timp (zilnic)

# 18.10.2026: notează în fiecare zi de bursă verdictele Reguli V1 pe universul înghețat și evaluează la 5 / 20 de sesiuni față de reper.
# Protocolul (scris înaintea datelor): docs/v1-proba-protocol.md; proba Premarket Top Long: docs/premarket-proba-protocol.md. Fără chei. După închiderea SUA (20:00 UTC vara, 21:00 iarna).
on:
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * 1-5'
    # 27.10.2026 (audit): rularea de seară a picat în 5 din 7 sesiuni (20–23.10, 27.10; rulări întârziate de GitHub la 00:07–00:48 UTC) ⇒ a doua șansă
    # dimineața, înainte de deschiderea SUA, DOAR dacă ziua lipsește din jurnal (DOAR_LIPSA=1); ziua notată seara nu se rescrie.
    - cron: '15 10 * * 2-6'

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trading-tools-v1-proba
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # 19.10.2026: și garda amprentei Top Long + reluarea seriilor (auditul Long & Reversal)
      # 27.10.2026 (revizia F): și garda fișierelor înghețate (doar cresc) + reluarea seriilor V1
      - run: node --test tools/v1-proba.test.mjs tools/independent-scanner.test.mjs tools/premarket-proba.test.mjs tools/candidate-autostart.test.mjs tools/top-long-proba.test.mjs tools/premarket-jurnal-serii.test.mjs tools/reversal-umbra.test.mjs tools/premarket-calendar.test.mjs tools/probe-inghetat.test.mjs tools/v1-jurnal-serii.test.mjs tools/probe-amprente-acoperire.test.mjs
      # 27.10.2026 (audit): pasul pica tăcut (5 din 7 sesiuni pierdute, nimeni n-a aflat) ⇒ o a doua încercare după 3 minute, mesajul erorii păstrat și Discord la eșec
      - name: Ziua în jurnal + evaluarea
        id: v1
        continue-on-error: true
        env:
          DOAR_LIPSA: ${{ github.event.schedule == '15 10 * * 2-6' && '1' || '' }}
        # 28.10.2026 (revizia F2, 🔵6): fără pipefail, `node … | tee` întorcea codul lui tee (0) ⇒ a doua încercare și Discord-ul nu porneau niciodată
        run: |
          set -o pipefail
          node tools/v1-jurnal.mjs 2>&1 | tee v1-ziua.log || (sleep 180 && node tools/v1-jurnal.mjs 2>&1 | tee v1-ziua.log)
      - name: Anunță pe Discord că ziua V1 lipsește
        # 28.10.2026: doar la pierderea reală (rezerva de dimineață sau o rulare de mână); seara, GitHub pornește fluxul abia la 00:07–00:48 UTC,
        # când Yahoo nu dă încă bara zilei (DATE STALE) — o acoperă rezerva de la 10:15 UTC, deci seara motivul rămâne doar în jurnal
        if: steps.v1.outcome == 'failure' && github.event.schedule != '45 21 * * 1-5'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            MOTIV=$(tail -c 300 v1-ziua.log 2>/dev/null | tr '\n' ' ' | sed 's/"/'"'"'/g')
            curl -sS -H 'Content-Type: application/json' -d "{\"content\":\"⚠️ Proba Reguli V1: robotul n-a putut nota ziua de azi (două încercări). Motiv: $MOTIV — a doua șansă vine dimineața la 10:15 UTC; altfel rulează manual fluxul «Reguli V1 — proba în timp».\"}" "$DISCORD_WEBHOOK" || true
          fi
      # 18.10.2026: proba Premarket Scanner (Top Long), docs/premarket-proba-protocol.md; dacă pică, ziua V1 se salvează oricum
      # 19.10.2026 (audit): o a doua încercare după 3 minute; dacă pică de două ori, mesaj pe Discord (altfel ziua se pierdea pe tăcute)
      - name: Premarket Top Long în jurnal + evaluarea
        id: premarket
        continue-on-error: true
        # 19.10.2026 — I-720: cheia ajunge la robot, dar e citită DOAR dacă protocolul probei cere calendarul (premarket-proba-1: oprit)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # 27.10.2026 (revizia F, 🟡9): și aici rezerva de dimineață notează doar ziua care lipsește (ziua de seară nu se rescrie)
          DOAR_LIPSA: ${{ github.event.schedule == '15 10 * * 2-6' && '1' || '' }}
        run: node tools/premarket-jurnal.mjs || (sleep 180 && node tools/premarket-jurnal.mjs)
      - name: Anunță pe Discord că ziua Premarket lipsește
        if: steps.premarket.outcome == 'failure' && github.event.schedule != '45 21 * * 1-5'   # 28.10.2026: ca la V1, doar la pierderea reală
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -H 'Content-Type: application/json' -d "{\"content\":\"⚠️ Proba Top Long: robotul n-a putut nota ziua de azi (două încercări). Rulează manual fluxul «Reguli V1 — proba în timp» din GitHub Actions.\"}" "$DISCORD_WEBHOOK" || true
          fi
      - name: Salvează jurnalul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner-verdicts/generated/v1-jurnal.json scanner-verdicts/generated/v1-proba.json
          # 27.10.2026 (revizia F, 🔴2): perioadele și judecata înghețate (fișierele doar cresc); jurnalul Top Long;
          # 19.10.2026 — I-716: jurnalul separat al stopului Early Reversal în umbră (docs/reversal-stop-umbra-protocol.md)
          # 28.10.2026 (revizia F2, 🟡1): câte un `git add` pe fișier — un singur `git add a b || true` nu salva NIMIC cât lipsea unul
          node tools/git-add-existente.mjs scanner-verdicts/generated/v1-inghetat.jsonl scanner-verdicts/generated/premarket-inghetat.jsonl scanner-verdicts/generated/premarket-jurnal.json scanner-verdicts/generated/premarket-proba.json scanner-verdicts/generated/reversal-umbra-jurnal.json scanner-verdicts/generated/reversal-umbra-proba.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(v1): ziua in proba [skip ci]'
            # 28.10.2026 (revizia F2, 🔵13): o cursă cu alt robot nu mai pierde ziua — 3 încercări, apoi pică vizibil
            ok=0; for i in 1 2 3; do if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 10; done
            [ "$ok" = 1 ] || { echo 'Push eșuat de 3 ori.'; exit 1; }
          fi
