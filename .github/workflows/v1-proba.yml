name: Reguli V1 — proba în timp (zilnic)

# 18.10.2026: notează în fiecare zi de bursă verdictele Reguli V1 pe universul înghețat și evaluează la 5 / 20 de sesiuni față de reper.
# Protocolul (scris înaintea datelor): docs/v1-proba-protocol.md; proba Premarket Top Long: docs/premarket-proba-protocol.md. Fără chei. După închiderea SUA (20:00 UTC vara, 21:00 iarna).
on:
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * 1-5'

permissions:
  contents: write

jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trading-tools-v1-proba
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # 19.10.2026: și garda amprentei Top Long + reluarea seriilor (auditul Long & Reversal)
      - run: node --test tools/v1-proba.test.mjs tools/independent-scanner.test.mjs tools/premarket-proba.test.mjs tools/candidate-autostart.test.mjs tools/top-long-proba.test.mjs tools/premarket-jurnal-serii.test.mjs tools/reversal-umbra.test.mjs tools/premarket-calendar.test.mjs
      - name: Ziua în jurnal + evaluarea
        run: node tools/v1-jurnal.mjs
      # 18.10.2026: proba Premarket Scanner (Top Long), docs/premarket-proba-protocol.md; dacă pică, ziua V1 se salvează oricum
      # 19.10.2026 (audit): o a doua încercare după 3 minute; dacă pică de două ori, mesaj pe Discord (altfel ziua se pierdea pe tăcute)
      - name: Premarket Top Long în jurnal + evaluarea
        id: premarket
        continue-on-error: true
        # 19.10.2026 — I-720: cheia ajunge la robot, dar e citită DOAR dacă protocolul probei cere calendarul (premarket-proba-1: oprit)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node tools/premarket-jurnal.mjs || (sleep 180 && node tools/premarket-jurnal.mjs)
      - name: Anunță pe Discord că ziua Premarket lipsește
        if: steps.premarket.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -H 'Content-Type: application/json' -d "{\"content\":\"⚠️ Proba Top Long: robotul n-a putut nota ziua de azi (două încercări). Rulează manual fluxul «Reguli V1 — proba în timp» din GitHub Actions.\"}" "$DISCORD_WEBHOOK" || true
          fi
      - name: Salvează jurnalul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner-verdicts/generated/v1-jurnal.json scanner-verdicts/generated/v1-proba.json
          git add scanner-verdicts/generated/premarket-jurnal.json scanner-verdicts/generated/premarket-proba.json 2>/dev/null || true
          # 19.10.2026 — I-716: jurnalul separat al stopului Early Reversal în umbră (docs/reversal-stop-umbra-protocol.md)
          git add scanner-verdicts/generated/reversal-umbra-jurnal.json scanner-verdicts/generated/reversal-umbra-proba.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'data(v1): ziua in proba [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
