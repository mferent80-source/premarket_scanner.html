name: Trading Tools publication and Breadth
run-name: "${{ github.event_name == 'push' && 'App publication' || 'Breadth' }} ${{ inputs.request_id || github.event_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        description: Scan request identifier (optional)
        required: false
        type: string
  schedule:
    # UTC; before US trading and after the close, weekdays.
    - cron: '20 12,22 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A queued app publication must never hold the EOD scan's reservation.
    concurrency:
      group: trading-tools-breadth-eod-v2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/market-breadth -p 'test_*.py'
      - run: pip install requests pyyaml tzdata jsonschema
      - run: python -m unittest discover -s tools/breadth-suite -p 'test_*.py'
      - run: python tools/breadth-suite/market-breadth-analyzer/tests_core.py
      - name: Complete Breadth scan
        id: breadth
        continue-on-error: true
        env:
          BREADTH_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
          BREADTH_CACHE_DIR: ${{ runner.temp }}/breadth-cache
        run: python tools/breadth-suite/run.py --backtests auto
      - name: Require this scan's completed public manifest
        env:
          BREADTH_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('market-breadth/generated/run-status.json').read_text())
          assert result['requestId'] == os.environ['BREADTH_REQUEST_ID'], 'Scan did not publish its own result'
          assert result['status'] in ('COMPLETE', 'PARTIAL', 'ERROR') and result.get('finishedAt'), 'Scan did not finish'
          PY
      - name: Save dated Breadth observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-breadth/data/latest.json market-breadth/generated
          if ! git diff --cached --quiet; then
            git commit -m 'data(breadth): refresh public EOD observations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: scan
    if: always() && (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trading-tools-pages-deploy-v2
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Read main again after the scan's data commit and any concurrent app update.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: App regression checks before publishing
        run: node --test tools/*.test.mjs tools/*.test.cjs
      # GITHUB_TOKEN commits do not trigger another push; deploy this snapshot here.
      - name: Remove Python runtime files from published site
        run: |
          rm -rf tools/breadth-suite/market-breadth-analyzer/dashboard tools/breadth-suite/market-breadth-analyzer/reports tools/breadth-suite/uptrend-analyzer/reports tools/breadth-suite/market-breadth-analyzer/nasdaq100/reports tools/breadth-suite/market-breadth-analyzer/russell2000/reports
          find tools/breadth-suite -type d -name __pycache__ -prune -exec rm -rf {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
