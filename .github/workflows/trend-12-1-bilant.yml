name: Trend 12 luni — bilanțul probei (săptămânal)

# I-614 (14.10.2026): măsoară istoricul zilnic al clasamentului la 20 / 60 de zile față de SPY și față de universul zilei și scrie
# candidate-engine/generated/trend-12-1-bilant.json. Fără chei. Sâmbăta, după ce săptămâna s-a închis.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 6'   # UTC, sâmbăta

permissions:
  contents: write

jobs:
  bilant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trading-tools-trend-12-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tools/trend-12-1.test.mjs tools/trend-12-1-robot.test.mjs
      - name: Bilanțul probei
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # I-631: DOAR când verdictul se schimbă
        run: node tools/trend-12-1-bilant.mjs
      - name: Salvează bilanțul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-engine/generated/trend-12-1-bilant.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(trend): bilantul probei [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Discord la eșec (I-629)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          VECHI=$(node -e "try{const j=require('./candidate-engine/generated/trend-12-1.json');console.log(j.dataUltimei+', acum '+Math.round((Date.now()-Date.parse(j.dataUltimei+'T21:00:00Z'))/864e5)+' zile')}catch{console.log('necunoscut')}")
          node -e "const m={content:'**Robotul Trend 12 luni a PICAT** · '+process.argv[1]+' · rularea '+process.argv[2]+'\\n'+process.argv[3]+'\\nultimul clasament bun: '+process.argv[4]+' — JSON-ul rămâne cel vechi până la o rulare bună; Radarul îl va arăta VECHI.'};fetch(process.env.DISCORD_WEBHOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(m)}).then(r=>console.log('Discord: '+r.status)).catch(e=>console.log('Discord: '+e.message))" "${{ github.workflow }}" "${{ github.run_number }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$VECHI"
