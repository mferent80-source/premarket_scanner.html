name: Trend 12 luni — bilanțul probei (săptămânal)

# I-614 (14.10.2026): măsoară istoricul zilnic al clasamentului la 20 / 60 de zile față de SPY și față de universul zilei și scrie
# candidate-engine/generated/trend-12-1-bilant.json. Fără chei. Sâmbăta, după ce săptămâna s-a închis.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 6'   # UTC, sâmbăta

permissions:
  contents: write

jobs:
  bilant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trading-tools-trend-12-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tools/trend-12-1.test.mjs tools/trend-12-1-robot.test.mjs
      - name: Bilanțul probei
        run: node tools/trend-12-1-bilant.mjs
      - name: Salvează bilanțul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-engine/generated/trend-12-1-bilant.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(trend): bilantul probei [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
