name: Trend 12 luni (clasament zilnic pentru Candidate Engine)

# 14.10.2026: robotul semnalului „Trend 12 luni” — primele 20 % după randamentul pe lunile 2–12 (ultima lună sărită), pe ~600 de
# acțiuni SUA ≥ 2 mld. $. Scrie candidate-engine/generated/trend-12-1.json (citit de scanner) + istoricul zilnic (testul de peste
# 6–12 luni). Pages (legacy, din main) publică singur după commit. O rulare pe zi lucrătoare, după închiderea US; depozitul e public
# ⇒ minutele nu costă.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * 1-5'   # UTC, după închiderea de la 20:00 UTC
    - cron: '10 3 * * 2-6'    # 15.10.2026: a doua încercare, dacă la prima peste 5 % din acțiuni n-aveau încă bara zilei (Actions întârzie rulările)

permissions:
  contents: write

jobs:
  clasament:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: trading-tools-trend-12-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tools/trend-12-1.test.mjs tools/trend-12-1-robot.test.mjs
      - name: Clasamentul zilei
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # raportările (I-621) — același secret ca price-alerts
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # intrări/ieșiri (I-617) — doar la schimbare
          INCERCARE: ${{ github.event_name == 'schedule' && github.event.schedule == '10 3 * * 2-6' && 'a doua' || 'prima' }}   # 15.10: decizieDateVechi
        run: node tools/trend-12-1.mjs
      - name: Garda de formă a fișierelor publicate
        run: node --test tools/trend-12-1-robot.test.mjs
      - name: Salvează clasamentul și istoricul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidate-engine/generated
          if ! git diff --cached --quiet; then
            git commit -m 'data(trend): clasamentul 12-1 al zilei [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Discord la eșec (I-629)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          VECHI=$(node -e "try{const j=require('./candidate-engine/generated/trend-12-1.json');console.log(j.dataUltimei+', acum '+Math.round((Date.now()-Date.parse(j.dataUltimei+'T21:00:00Z'))/864e5)+' zile')}catch{console.log('necunoscut')}")
          node -e "const m={content:'**Robotul Trend 12 luni a PICAT** · '+process.argv[1]+' · rularea '+process.argv[2]+'\\n'+process.argv[3]+'\\nultimul clasament bun: '+process.argv[4]+' — JSON-ul rămâne cel vechi până la o rulare bună; Radarul îl va arăta VECHI.'};fetch(process.env.DISCORD_WEBHOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(m)}).then(r=>console.log('Discord: '+r.status)).catch(e=>console.log('Discord: '+e.message))" "${{ github.workflow }}" "${{ github.run_number }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$VECHI"
